<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 群聊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   外观：方案 H「星图圆桌」——深色为主，也有浅色版
   所有颜色都是变量，切换主题只换一组变量
   ===================================================================== */
:root, html[data-theme="dark"] {
  --bg: #0a0b10; --panel: #0f1017; --card: #13141c; --card-2: #1b1d2a; --line: #1c1e28; --line-2: #2a2c3c;
  --text: #e8e8f0; --text-2: #d4d5e0; --muted: #a4a6b8; --faint: #6f7286;
  --me-bg: #e8e8f0; --me-text: #0a0b10; --accent: #c4b5fd; --accent-text: #0a0b10;
  --harsh: #f9a8d4; --harsh-bg: #1a1219; --harsh-line: #5a2d4f; --star: #fcd34d; --danger: #fb7185;
  --glow: .5; --shadow: 0 16px 50px rgba(0,0,0,.55);
  --rail-w: 72px; --board-w: 340px; --panel-w: 370px;
}
html[data-theme="light"] {
  --bg: #f6f6fa; --panel: #ffffff; --card: #ffffff; --card-2: #eeedf6; --line: #e6e5ee; --line-2: #d9d8e4;
  --text: #16151f; --text-2: #2b2a38; --muted: #646377; --faint: #8e8da0;
  --me-bg: #16151f; --me-text: #f6f6fa; --accent: #6d5bd0; --accent-text: #ffffff;
  --harsh: #be185d; --harsh-bg: #fdf0f6; --harsh-line: #f3c2da; --star: #d97706; --danger: #e11d48;
  --glow: .25; --shadow: 0 16px 50px rgba(30,25,70,.14);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; overflow: hidden; background: var(--bg); color: var(--text);
  font: 15px/1.65 Sora, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--text); }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
[hidden] { display: none !important; }

.btn { border: 1px solid var(--line-2); background: transparent; border-radius: 12px; padding: 8px 14px; color: var(--text-2); }
.btn:hover { background: var(--card-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 5px 12px; font-size: 13px; border-radius: 10px; }
.pill { border: 1px solid var(--line-2); background: var(--card-2); border-radius: 999px; padding: 6px 14px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
.pill:hover { border-color: var(--accent); }
.pill.on { border-color: var(--accent); color: var(--accent); }
.icon-btn { width: 36px; height: 36px; border: none; background: transparent; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--muted); flex-shrink: 0; }
.icon-btn:hover { background: var(--card-2); color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }
.seg { display: flex; background: var(--card); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; font-size: 13px; flex-shrink: 0; }
.seg button { border: none; background: transparent; border-radius: 999px; padding: 4px 14px; color: var(--muted); }
.seg button.on { background: var(--me-bg); color: var(--me-text); font-weight: 600; }

/* ---------- 头像（圆形 + 成员颜色描边） ---------- */
.avatar {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: var(--c, #999); border: 1.5px solid var(--c, #999);
  background: color-mix(in srgb, var(--c, #999) 14%, var(--bg)); user-select: none; transition: box-shadow .3s;
}
.avatar.sm { width: 28px; height: 28px; font-size: 11px; }
.avatar.speaking { box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 15%, transparent), 0 0 22px color-mix(in srgb, var(--c) calc(var(--glow) * 100%), transparent); }

/* =====================================================================
   左侧：群图标栏
   ===================================================================== */
#rail { width: var(--rail-w); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 0; flex-shrink: 0; }
#group-rail { display: flex; flex-direction: column; gap: 12px; align-items: center; overflow-y: auto; flex: 0 1 auto; padding: 4px; }
.rail-item {
  position: relative; width: 44px; height: 44px; border-radius: 14px; background: var(--card); border: 1px solid transparent;
  display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; flex-shrink: 0;
}
.rail-item:hover { color: var(--text); background: var(--card-2); }
.rail-item.active { background: var(--card-2); border-color: color-mix(in srgb, var(--accent) 45%, var(--line-2)); color: var(--text); }
.rail-item .dot { position: absolute; top: -3px; right: -3px; width: 11px; height: 11px; border-radius: 50%; background: #f472b6; border: 2px solid var(--bg); }
.rail-item.busy::after { content: ""; position: absolute; inset: -4px; border-radius: 17px; border: 1.5px solid var(--accent); opacity: .5; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .1; } }
.rail-add { border: 1px dashed var(--line-2) !important; background: transparent !important; }
#me-btn { margin-top: auto; width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--me-bg); color: var(--me-text); font-weight: 700; font-size: 13px; padding: 0; }

/* =====================================================================
   中间
   ===================================================================== */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#chat-head { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-shrink: 0; flex-wrap: wrap; }
.head-title { min-width: 120px; max-width: 260px; }
.head-title .t { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-title .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#roundtable { flex: 1; display: flex; justify-content: center; gap: 20px; position: relative; cursor: pointer; min-width: 120px; }
.rt-seat { display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; z-index: 1; }
.rt-seat span { font-size: 10px; color: var(--muted); max-width: 64px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt-seat.speaking span { color: var(--c); }
.rt-seat.off { opacity: .35; }
.rt-link { position: absolute; height: 2px; border-radius: 2px; transform-origin: 0 50%; opacity: 0; pointer-events: none; z-index: 0; transition: opacity .4s; }
.rt-link.show { opacity: .85; }

#views { flex: 1; position: relative; min-height: 0; display: flex; }
#chat { flex: 1; overflow-y: auto; padding: 18px 24px 10px; }
#messages, #typing-area { max-width: 700px; margin: 0 auto; }
.fold-bar {
  display: flex; width: 100%; align-items: center; gap: 10px; border: 1px dashed var(--line-2); background: transparent; color: var(--muted);
  border-radius: 12px; padding: 9px 14px; font-size: 13px; text-align: left; margin-bottom: 6px;
}
.fold-bar:hover { border-color: var(--accent); }
.fold-bar span:first-child { flex: 1; }
.fold-bar b { color: var(--accent); font-weight: 600; }
.time-sep { text-align: center; font-size: 11px; color: var(--faint); margin: 18px 0 8px; letter-spacing: .5px; }
.sys-msg { text-align: center; margin: 14px 0; }
.sys-msg span { border: 1px solid var(--line-2); color: var(--muted); font-size: 12px; padding: 4px 14px; border-radius: 999px; }
.empty-hint { text-align: center; color: var(--muted); margin-top: 14vh; }
.empty-hint .big { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; }

.msg { display: flex; gap: 14px; margin-top: 16px; position: relative; animation: rise .25s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg.cont { margin-top: 3px; }
.msg .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-top: 9px; flex-shrink: 0; box-shadow: 0 0 10px color-mix(in srgb, var(--c) calc(var(--glow) * 140%), transparent); }
.msg.cont .dot { visibility: hidden; }
.msg-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.msg-name { font-size: 12px; font-weight: 600; color: var(--c); display: flex; gap: 6px; align-items: baseline; }
.msg-name .to { color: var(--muted); font-weight: 400; }
.msg-name .star { color: var(--star); }
.msg.cont .msg-name { display: none; }
.msg .text { color: var(--text); overflow-wrap: anywhere; }
.msg .text.error { color: var(--danger); font-size: 13px; }
.msg.long .text { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.msg.long.clamped .text-inner { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.more { border: none; background: none; padding: 2px 0 0; color: var(--accent); font-size: 13px; }
.msg.me { justify-content: flex-end; }
.msg.me .msg-body { flex: 0 1 auto; max-width: 72%; align-items: flex-end; }
.msg.me .bubble { background: var(--me-bg); color: var(--me-text); padding: 10px 16px; border-radius: 16px 16px 4px 16px; overflow-wrap: anywhere; }
.msg.me.cont .bubble { border-radius: 16px 4px 4px 16px; }
.msg.flash .msg-body { animation: flash 1.6s; }
@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 12px; } 100% { background: transparent; } }
.text pre { background: var(--card-2); padding: 9px 12px; border-radius: 10px; overflow-x: auto; margin: 6px 0; font-size: 13px; }
.text code { background: var(--card-2); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
.text pre code { background: none; padding: 0; }
.at { font-weight: 600; }
.quote { font-size: 13px; opacity: .75; border-left: 2px solid currentColor; padding-left: 8px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.atts { display: flex; flex-wrap: wrap; gap: 6px; }
.msg.me .atts { justify-content: flex-end; }
.atts img { max-width: 240px; max-height: 240px; border-radius: 14px; cursor: zoom-in; display: block; border: 1px solid var(--line-2); }
.file-chip { display: inline-flex; gap: 8px; align-items: center; padding: 9px 13px; border-radius: 12px; background: var(--card); border: 1px solid var(--line-2); font-size: 13px; max-width: 260px; }
.file-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-actions { position: absolute; top: -16px; display: none; gap: 2px; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px; z-index: 2; box-shadow: var(--shadow); }
.msg:not(.me) .msg-actions { left: 22px; }
.msg.me .msg-actions { right: 0; }
.msg:hover .msg-actions, .msg.show-actions .msg-actions { display: flex; }
.msg-actions button { border: none; background: none; padding: 2px 10px; border-radius: 999px; font-size: 12px; color: var(--text-2); }
.msg-actions button:hover { background: var(--line-2); }
.msg-actions .meta { font-size: 11px; color: var(--faint); padding: 2px 6px 2px 10px; align-self: center; white-space: nowrap; }
.typing-row { display: flex; gap: 14px; align-items: center; margin-top: 14px; font-size: 13px; color: var(--c); }
.typing-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); animation: pulse 1.2s infinite; box-shadow: 0 0 10px var(--c); }

#new-pill { position: absolute; left: 50%; transform: translateX(-50%); bottom: 110px; display: none; background: var(--accent); color: var(--accent-text); border: none; border-radius: 999px; padding: 6px 16px; font-size: 13px; font-weight: 600; z-index: 5; box-shadow: var(--shadow); }

/* ---------- 沙盘 ---------- */
#sandbox { flex: 1; position: relative; overflow: hidden; }
.ring { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid var(--line); pointer-events: none; }
.ring.r3 { border-style: dashed; }
.core { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 240px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.core .label { font-size: 11px; letter-spacing: 2px; color: var(--muted); }
.core .q { font-size: 18px; font-weight: 700; line-height: 1.45; }
.core .sun { width: 8px; height: 8px; border-radius: 50%; background: var(--text); box-shadow: 0 0 0 6px color-mix(in srgb, var(--text) 8%, transparent), 0 0 30px color-mix(in srgb, var(--text) 50%, transparent); }
.node {
  position: absolute; transform: translate(-50%, -50%); width: 210px; text-align: left; border-radius: 14px; padding: 10px 13px;
  background: color-mix(in srgb, var(--c) 10%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
  color: var(--text); font-size: 14px; line-height: 1.5; animation: drift 7s ease-in-out infinite alternate;
}
.node:hover { z-index: 3; border-color: var(--c); }
.node.inner { box-shadow: 0 0 28px color-mix(in srgb, var(--c) calc(var(--glow) * 40%), transparent); font-size: 15px; }
.node.outer { width: 170px; font-size: 12px; opacity: .35; background: transparent; border-color: var(--line-2); }
.node.harsh { background: var(--harsh-bg); border-color: var(--harsh-line); }
.node .nh { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; margin-bottom: 2px; }
.node .nh b { color: var(--c); }
.node .nh span { color: var(--muted); white-space: nowrap; }
.node .nh .hs { color: var(--harsh); }
.node .nh .st { color: var(--star); }
@keyframes drift { from { margin-top: -3px; } to { margin-top: 3px; } }
.legend { position: absolute; left: 22px; bottom: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.sandbox-actions { position: absolute; right: 22px; bottom: 18px; display: flex; gap: 8px; }

/* ---------- 输入区 ---------- */
#composer-wrap { padding: 8px 24px 18px; flex-shrink: 0; }
#composer-inner { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.tools-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { border: 1px solid var(--line-2); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 12px; }
.chip-btn:hover { color: var(--text); border-color: var(--muted); }
.chip-btn:disabled { opacity: .4; cursor: not-allowed; }
#composer { position: relative; background: var(--card); border: 1px solid var(--line-2); border-radius: 16px; padding: 6px; transition: border-color .15s; }
#composer:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--line-2)); }
#composer.dragover { border-color: var(--accent); }
#reply-bar, #pending-atts { display: none; margin: 4px 8px 6px; }
#reply-bar { font-size: 13px; color: var(--muted); align-items: center; gap: 8px; border-left: 2px solid var(--accent); padding: 2px 4px 2px 10px; }
#reply-bar span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pending-atts { flex-wrap: wrap; gap: 8px; }
.pending { position: relative; }
.pending img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; display: block; }
.pending .x { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: var(--text); color: var(--bg); font-size: 11px; line-height: 20px; padding: 0; }
.compose-row { display: flex; align-items: flex-end; gap: 6px; }
#input { flex: 1; resize: none; border: none; outline: none; background: transparent; padding: 8px 8px; min-height: 40px; max-height: 180px; line-height: 1.5; }
#send-btn { width: 38px; height: 38px; border: none; border-radius: 12px; background: var(--me-bg); color: var(--me-text); display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
#send-btn svg { width: 16px; height: 16px; }
#send-btn.stop { background: var(--danger); color: #fff; }
#mention-pop { position: absolute; bottom: 100%; left: 0; margin-bottom: 8px; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); padding: 5px; min-width: 230px; display: none; z-index: 10; }
.mention-item { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 10px; cursor: pointer; }
.mention-item.active, .mention-item:hover { background: var(--line-2); }

/* =====================================================================
   右侧：观点板（宽屏时固定在右边，窄屏时浮在上面）
   ===================================================================== */
#board { width: var(--board-w); flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.board-head { display: flex; align-items: center; gap: 8px; padding: 14px 12px 8px 18px; }
.board-head b { flex: 1; font-weight: 600; }
#board-body { flex: 1; overflow-y: auto; padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.b-question { font-size: 13px; color: var(--muted); background: var(--card); border-radius: 12px; padding: 10px 12px; }
.b-group { display: flex; flex-direction: column; gap: 6px; }
.b-title { font-size: 12px; font-weight: 600; color: var(--accent); }
.b-group.harsh .b-title { color: var(--harsh); }
.b-item { text-align: left; background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 11px; font-size: 13px; color: var(--text); width: 100%; }
.b-item:hover { border-color: var(--muted); }
.b-item b { color: var(--c); font-weight: 600; margin-right: 4px; }
.b-group.harsh .b-item { background: var(--harsh-bg); border-color: var(--harsh-line); }
.b-item.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.b-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.b-link { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-2); background: var(--card); border-radius: 10px; padding: 6px 8px 6px 10px; }
.b-link span { flex: 1; }
.b-actions { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.b-actions .btn { flex: 1; font-size: 13px; }
.b-saved summary { cursor: pointer; font-size: 13px; color: var(--text-2); padding: 4px 0; }

/* =====================================================================
   群设置面板（从右边滑出来）
   ===================================================================== */
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w); max-width: 100vw; background: var(--panel); border-left: 1px solid var(--line-2); box-shadow: var(--shadow); transform: translateX(105%); transition: transform .24s ease; z-index: 40; display: flex; flex-direction: column; }
#panel.open { transform: none; }
.panel-head { display: flex; align-items: center; padding: 16px 12px 10px 20px; font-weight: 600; font-size: 16px; }
.panel-head span { flex: 1; }
#panel-body { flex: 1; overflow-y: auto; padding: 0 18px 24px; }
.section-title { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--faint); margin: 20px 2px 8px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 5px 2px; }
.field input[type=text], .field input[type=password], .field textarea, .field select { width: 100%; border: 1px solid var(--line-2); background: var(--card); border-radius: 10px; padding: 8px 10px; outline: none; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 90px; }
.segmented { display: flex; background: var(--card); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 3px; }
.segmented button { flex: 1; border: none; background: transparent; border-radius: 999px; padding: 5px 4px; font-size: 13px; color: var(--muted); }
.segmented button.on { background: var(--me-bg); color: var(--me-text); font-weight: 600; }
.mode-desc { font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
.member-card { border: 1px solid var(--line-2); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
.member-card.disabled .mc-head { opacity: .45; }
.mc-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; }
.mc-head:hover, .member-card.open .mc-head { background: var(--card); }
.mc-head .info { flex: 1; min-width: 0; }
.mc-head .n { font-weight: 600; }
.mc-head .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); margin-left: 4px; }
.mc-edit { display: none; padding: 4px 12px 14px; border-top: 1px solid var(--line); }
.member-card.open .mc-edit { display: block; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatch.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--text); }
.row2 { display: flex; gap: 8px; }
.row2 .field { flex: 1; }
.row2 .field.narrow { flex: 0 0 76px; }
.model-info { font-size: 12px; color: var(--muted); margin: 5px 2px 0; }

<script>
/* =====================================================================
   AI 群聊 v0.3
   - 多个群，每个群有自己的成员、人设和聊天记录
   - 通过 OpenRouter 调用各家模型；可以发图片、PDF、文本文件
   - 数据都存在本机：设置在 localStorage，群和聊天记录在 IndexedDB（容量大，放得下图片）
   ===================================================================== */

const API_URL = "https://openrouter.ai/api/v1/chat/completions";
const MODELS_URL = "https://openrouter.ai/api/v1/models";
const MAX_HISTORY = 40;     // 每次最多把最近 40 条消息发给 AI
const IMAGE_HISTORY = 6;    // 只有最近 6 条消息里的图片/PDF 会真的发给 AI（更早的只说"发过一张图"），省钱
const MAX_CHAIN = 3;        // 一轮里AI之间互相@接话最多几次
const MAX_SPEAKERS = 3;     // 自然群聊模式下，没被@的时候每轮最多几个人说话（其他人这轮安静）
const MAX_BUBBLES = 2;      // 一个AI一次最多发几条气泡，多出来的合并到最后一条
const PALETTE = ["#d97757", "#10a37f", "#4285f4", "#6b5ce7", "#e8a33d", "#e05d8c", "#2bb5c4", "#7a8a99"];

/* ---------- 默认成员和人设模板 ---------- */
const PERSONA_TEMPLATES = {
  "靠谱学长": "群里靠谱又有点话痨的学长型。认真，爱分析，会直说风险，但不是老古板，偶尔冷幽默、自嘲。",
  "点子王": "群里的点子王。热情、反应快、爱用emoji，脑洞一个接一个，有时候有点浮夸，被怼了也不生气。",
  "杠精": "群里的杠精担当。总能找到别人没想到的角度，口头禅是'但是'，不过杠得有理有据，杠完会给建设性意见。",
  "接地气老朋友": "群里最接地气的老朋友。熟悉国内情况和网络梗，说话像在饭桌上聊天，爱举身边的例子。",
  "知心大姐姐": "知心大姐姐，温柔但不软弱。说话轻声细语，会先接住对方的情绪，再说道理，比如\"我能理解你为什么会这么想\"\"先别急，我们慢慢捋一捋\"。她不会一味顺着人说好话：别人的想法不靠谱时，她会温和但很清楚地指出问题，像姐姐那样\"我得跟你说句实话\"。比起\"该怎么做\"，她更在意\"你自己真正想要什么\"，常常反问一句，让人自己想明白。群里有人吵起来，她会出来打圆场，也会替说话少的人说两句。偶尔用\"～\"和🫶，但不过分甜腻。",
  "毒舌损友": "嘴很毒的损友，专门戳破幻想、吐槽不靠谱的计划，损得好笑但有分寸、不说脏话。吐槽完一定会认真给一个更靠谱的替代方案。",
  "温哥华学姐": "在温哥华读了三年书的学姐，熟悉加拿大留学、打工、租房、选课、PR 这些事，说话实在，爱分享自己踩过的坑。涉及政策和规定时会提醒大家去官网核实。",
  "冷静分析师": "说话简短冷静，只讲数据和逻辑，常问'证据是什么''成本多少''最坏情况是什么'，偶尔冷不丁来一句很好笑的话。",
};
const DEFAULT_MEMBERS = [
  { id: "m1", name: "Claude", avatar: "C", color: "#d97757", enabled: true, model: "",
    modelPattern: "^anthropic/claude-sonnet", persona: PERSONA_TEMPLATES["靠谱学长"] },
  { id: "m2", name: "ChatGPT", avatar: "G", color: "#10a37f", enabled: true, model: "",
    modelPattern: "^openai/gpt-\\d", persona: PERSONA_TEMPLATES["点子王"] },
  { id: "m3", name: "Gemini", avatar: "Ge", color: "#4285f4", enabled: false, model: "",
    modelPattern: "^google/gemini-\\d", persona: PERSONA_TEMPLATES["杠精"] },
  { id: "m4", name: "DeepSeek", avatar: "D", color: "#6b5ce7", enabled: false, model: "",
    modelPattern: "^deepseek/deepseek", persona: PERSONA_TEMPLATES["接地气老朋友"] },
];
const OLD_PERSONAS = [
  "你思考细致，喜欢把问题拆开讲清楚，也会坦诚指出风险。", "你反应快，点子多，说话直接。",
  "你擅长提供不同角度和实际例子。", "你熟悉中国的情况，说话接地气。",
];
const MODES = {
  natural:    { label: "自然群聊", desc: "随机顺序发言，能看到彼此，会接话、会@人，没话说就潜水。" },
  parallel:   { label: "同时回答", desc: "大家各自独立思考，互相看不到这一轮的回答，适合要几个不同意见。" },
  sequential: { label: "轮流发言", desc: "按成员顺序一个个说，后面的人能接着前面的人说。" },
};

/* =====================================================================
   存储
   ===================================================================== */
function lsLoad(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function lsSave(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

// IndexedDB：浏览器里的小数据库，每个群存成一条记录
let dbPromise = null;
function db() {
  return dbPromise ||= new Promise((resolve, reject) => {
    const req = indexedDB.open("aigc", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("groups", { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbAll() {
  const d = await db();
  return new Promise((res, rej) => {
    const q = d.transaction("groups").objectStore("groups").getAll();
    q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error);
  });
}
async function idbPut(value) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction("groups", "readwrite");
    t.objectStore("groups").put(value);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
async function idbDelete(id) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction("groups", "readwrite");
    t.objectStore("groups").delete(id);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
function saveGroup(g, touch = true) {
  if (touch) g.updatedAt = Date.now();
  idbPut(g).catch(e => toast("保存失败：" + e.message));
}

/* ---------- 全局状态 ---------- */
let config = lsLoad("aigc-config", {});
config = Object.assign({ apiKey: "", userName: "我", userAvatar: "", theme: "dark" }, config);
let groups = [];
let current = null;                 // 当前打开的群
let allModels = [];
const busyGroups = new Set();       // 哪些群正在有AI发言
const controllers = new Map();      // 群id → 正在进行的请求（用来"停止"）
const typing = new Map();           // 群id → 正在输入的成员id
let pendingAtts = [];               // 输入框里还没发出去的附件
let replyTo = null;                 // 正在引用的消息

const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

/* =====================================================================
   启动 & 旧版本数据迁移
   ===================================================================== */
function makeGroup(name, members) {
  return { id: uid("g_"), name, mode: "natural", members, messages: [], createdAt: Date.now(), updatedAt: Date.now() };
}
const OLD_AVATARS = { m1: "🦉", m2: "💡", m3: "🌸", m4: "🥟" };   // v0.2 的默认 emoji 头像，换成字母
function upgradeMember(m) {
  const def = DEFAULT_MEMBERS.find(d => d.id === m.id);
  if (m.avatar === OLD_AVATARS[m.id] || m.avatar === "🙂") m.avatar = def?.avatar || (m.name || "A").slice(0, 1);
  if (!m.avatar) m.avatar = def?.avatar || (m.name || "A").slice(0, 1);
  if (!m.persona || OLD_PERSONAS.includes(m.persona)) m.persona = def?.persona || m.persona || "";
  if (!m.modelPattern && def) m.modelPattern = def.modelPattern;
  return m;
}

async function init() {
  if (!config.themeV3) { config.theme = "dark"; config.themeV3 = true; lsSave("aigc-config", config); }
  applyTheme();
  try { groups = await idbAll(); }
  catch { groups = []; toast("本地数据库打不开，这次的聊天记录不会被保存"); }

  if (!groups.length) {
    // 从旧版本（只有一个群）搬过来
    const old = lsLoad("aigc-config", {});
    const oldMsgs = lsLoad("aigc-messages", []);
    const members = (old.members?.length ? old.members : structuredClone(DEFAULT_MEMBERS)).map(upgradeMember);
    const g = makeGroup("AI 群聊", members);
    g.mode = old.mode || "natural";
    g.messages = oldMsgs.map(m => ({ id: uid("msg_"), time: Date.now(), ...m }));
    groups.push(g);
    saveGroup(g);
    delete config.members; delete config.mode; delete config.version;   // 这些现在存在每个群里了
    lsSave("aigc-config", config);
  }
  groups.forEach(g => g.members.forEach(upgradeMember));
  const last = groups.find(g => g.id === config.activeGroupId);
  openGroup((last || sortedGroups()[0]).id);
  renderMe();
  loadModels();
  if (!config.apiKey) openSettings();
}

/* =====================================================================
   模型列表
   ===================================================================== */
async function loadModels(manual) {
  $("model-status").textContent = "正在获取…";
  try {
    const res = await fetch(MODELS_URL);
    const data = await res.json();
    allModels = (data.data || [])
      .filter(m => !m.id.includes(":") && !/batch|embed|tts|realtime|audio/i.test(m.id))
      .sort((a, b) => (b.created || 0) - (a.created || 0));
    $("model-options").innerHTML = allModels.map(m =>
      `<option value="${esc(m.id)}">${esc(m.name || m.id)}${canSeeImages(m.id) ? " · 可看图" : ""}${priceText(m)}</option>`).join("");
    $("model-status").textContent = `共 ${allModels.length} 个模型可选`;
    for (const g of groups) if (autoPickModels(g.members)) saveGroup(g, false);
    renderHeader(); renderPanel();
    if (manual) toast("模型列表已更新");
  } catch {
    $("model-status").textContent = "获取失败（可以手动填写模型名）";
  }
}
function modelInfo(id) { return allModels.find(m => m.id === id); }
function canSeeImages(id) {
  const mods = modelInfo(id)?.architecture?.input_modalities;
  return mods ? mods.includes("image") : true;   // 不知道的话就试试
}
function priceText(m) {
  const p = m.pricing;
  if (!p || p.prompt == null) return "";
  return ` · $${(parseFloat(p.prompt) * 1e6).toFixed(2)} / $${(parseFloat(p.completion) * 1e6).toFixed(2)} 每百万token`;
}
// 给还没选模型的成员，自动挑这一家最新一代里最便宜的标准版
function autoPickModels(members) {
  if (!allModels.length) return false;
  let changed = false;
  for (const mem of members) {
    if (mem.model || !mem.modelPattern) continue;
    const re = new RegExp(mem.modelPattern, "i");
    const matches = allModels.filter(m => re.test(m.id));
    const standard = matches.filter(m => !/pro|mini|nano|lite|oss|codex|fast|preview|image/i.test(m.id.split("/")[1]));
    const pool = standard.length ? standard : matches;
    const newest = pool[0]?.created || 0;
    const price = m => parseFloat(m.pricing?.prompt) || 0;
    const pick = pool.filter(m => newest - (m.created || 0) < 60 * 86400).sort((a, b) => price(a) - price(b))[0];
    if (pick) { mem.model = pick.id; changed = true; }
  }
  return changed;
}
function shortModel(id) { return id ? id.split("/").pop() : "未选模型"; }

/* =====================================================================
   左侧群图标栏
   ===================================================================== */
function sortedGroups() { return [...groups].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); }

function renderSidebar() {
  $("group-rail").innerHTML = sortedGroups().map(g => {
    const last = [...g.messages].reverse().find(m => m.sender !== "system");
    const tip = g.name + (last ? `\n${last.sender === "user" ? "我" : senderName(last.sender, g)}：${snippet(last)}` : "");
    return `<button class="rail-item ${g === current ? "active" : ""} ${busyGroups.has(g.id) ? "busy" : ""}"
      title="${esc(tip)}" aria-label="${esc(g.name)}" onclick="openGroup('${g.id}')">${esc(railLabel(g.name))}
      ${g.unread ? '<span class="dot"></span>' : ""}</button>`;
  }).join("");
}
function railLabel(name) { const t = (name || "群").replace(/^AI\s*/i, "").trim() || name; return [...t][0] || "群"; }
function avatarHtml(m, cls = "") {
  return `<div class="avatar ${cls}" style="--c:${m.color}">${esc(m.avatar)}</div>`;
}

function openGroup(id) {
  current = groups.find(g => g.id === id) || groups[0];
  current.unread = 0;
  current._expanded = false;
  config.activeGroupId = current.id;
  lsSave("aigc-config", config);
  setReply(null); linking = null;
  renderSidebar(); renderHeader(); renderView(); renderPanel(); renderBoard(); updateBusyUI();
}

async function newGroup() {
  // 新群默认带上当前群的成员和人设（用户自己调好的不用再调一遍）
  const members = structuredClone(current ? current.members : DEFAULT_MEMBERS);
  const g = makeGroup("新的群聊", members);
  groups.push(g);
  saveGroup(g);
  openGroup(g.id);
  togglePanel(true);
  setTimeout(() => { const el = $("group-name"); el?.focus(); el?.select(); }, 250);
}

async function deleteGroup() {
  if (busyGroups.has(current.id)) return toast("这个群还在聊天，先停止再删除");
  if (!await confirmBox(`删除「${esc(current.name)}」？聊天记录会一起删掉，不能恢复。`, "删除")) return;
  const id = current.id;
  groups = groups.filter(g => g.id !== id);
  await idbDelete(id).catch(() => {});
  if (!groups.length) { const g = makeGroup("AI 群聊", structuredClone(DEFAULT_MEMBERS)); groups.push(g); saveGroup(g); autoPickModels(g.members); }
  togglePanel(false);
  openGroup(sortedGroups()[0].id);
}

async function clearGroup() {
  if (busyGroups.has(current.id)) return;
  if (!await confirmBox("清空这个群的聊天记录？成员、人设和保存的线索会保留。", "清空")) return;
  current.messages = [];
  current.insights = null;
  saveGroup(current);
  renderView(); renderSidebar(); renderPanel(); renderBoard(); renderHeader();
}

/* =====================================================================
   顶栏：群名 + 圆桌（谁在说话谁发光，谁@了谁闪一条线）
   ===================================================================== */
function activeMembers(g = current) { return g.members.filter(m => m.enabled && m.model); }

// 一"轮"从你的一条消息（或"互相评论"）开始
function roundStarts(g = current) {
  const idx = [];
  g.messages.forEach((m, i) => { if (m.sender === "user" || m.sender === "system") idx.push(i); });
  return idx;
}

function renderHeader() {
  if (!current) return;
  $("head-title").textContent = current.name;
  const act = activeMembers();
  const rounds = roundStarts().length;
  $("head-sub").onclick = config.apiKey ? cycleMode : openSettings;
  $("head-sub").style.cursor = "pointer";
  $("head-sub").title = config.apiKey ? "点一下切换发言模式" : "";
  $("head-sub").textContent = !config.apiKey ? "还没填 API Key，点这里去设置"
    : !act.length ? "群里没有可用的AI，点右边 ⋯ 去开启"
    : `${MODES[current.mode]?.label || ""}${rounds ? ` · 第 ${rounds} 轮` : ""}`;
  renderRoundtable();
  renderQuickAsks();
}
function renderRoundtable() {
  const speaking = typing.get(current.id) || new Set();
  const list = current.members.slice(0, 6);
  $("roundtable").innerHTML = list.map(m => {
    const on = speaking.has(m.id);
    return `<div class="rt-seat ${on ? "speaking" : ""} ${m.enabled ? "" : "off"}" data-id="${m.id}" style="--c:${m.color}">
      ${avatarHtml(m, on ? "speaking" : "")}<span>${on ? "说话中" : esc(m.name)}</span></div>`;
  }).join("") + `<div class="rt-link" id="rt-link"></div>`;
}
// 圆桌上从 A 到 B 闪一条线（A @了 B）
let linkTimer = null;
function flashLink(fromId, toId) {
  const a = document.querySelector(`.rt-seat[data-id="${fromId}"] .avatar`);
  const b = document.querySelector(`.rt-seat[data-id="${toId}"] .avatar`);
  const line = $("rt-link");
  if (!a || !b || !line) return;
  const box = $("roundtable").getBoundingClientRect();
  const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  const x1 = ra.left + ra.width / 2 - box.left, y1 = ra.top + ra.height / 2 - box.top;
  const x2 = rb.left + rb.width / 2 - box.left, y2 = rb.top + rb.height / 2 - box.top;
  const fa = current.members.find(m => m.id === fromId), fb = current.members.find(m => m.id === toId);
  Object.assign(line.style, {
    left: x1 + "px", top: y1 + "px", width: Math.hypot(x2 - x1, y2 - y1) + "px",
    transform: `rotate(${Math.atan2(y2 - y1, x2 - x1)}rad)`,
    background: `linear-gradient(90deg, ${fa?.color || "#999"}, ${fb?.color || "#999"})`,
  });
  line.classList.add("show");
  clearTimeout(linkTimer);
  linkTimer = setTimeout(() => line.classList.remove("show"), 1800);
}
function cycleMode() {
  const keys = Object.keys(MODES);
  setMode(keys[(keys.indexOf(current.mode) + 1) % keys.length]);
  toast(`发言模式：${MODES[current.mode].label}——${MODES[current.mode].desc}`);
}
function renderQuickAsks() {
  const act = activeMembers();
  $("quick-asks").innerHTML = act.length > 1 ? act.slice(0, 4).map(m =>
    `<button class="chip-btn" onclick="askOnly('${m.id}')">只问${esc(m.name)}</button>`).join("") : "";
}
function askOnly(id) {
  const m = current.members.find(x => x.id === id);
  const el = $("input");
  el.value = "@" + m.name + " " + el.value.replace(/^(@\S+\s)+/, "");
  el.focus(); el.selectionStart = el.selectionEnd = el.value.length; autoGrow();
}

/* =====================================================================
   对话 / 沙盘 切换
   ===================================================================== */
let view = "chat";
function setView(v) {
  view = v;
  renderView();
}
function renderView() {
  document.querySelectorAll("#view-seg button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  $("chat").hidden = view !== "chat";

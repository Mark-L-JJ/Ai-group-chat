<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 群聊</title>
<style>
  /* ====== 样式：模仿微信群聊的样子 ====== */
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ededed; color: #222;
  }
  header {
    background: #f7f7f7; border-bottom: 1px solid #ddd;
    padding: 10px 16px; display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .sub { font-size: 12px; color: #888; font-weight: normal; }
  button {
    border: 1px solid #ccc; background: #fff; border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #f0f0f0; }
  button.primary { background: #07c160; color: #fff; border-color: #07c160; }
  button.primary:hover { background: #06ad56; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  .row { display: flex; gap: 8px; margin-bottom: 14px; align-items: flex-start; }
  .row.me { flex-direction: row-reverse; }
  .avatar {
    width: 38px; height: 38px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; font-size: 15px;
  }
  .body { max-width: 72%; }
  .name { font-size: 12px; color: #888; margin: 0 0 3px 2px; }
  .row.me .name { text-align: right; }
  .bubble {
    background: #fff; padding: 9px 12px; border-radius: 6px;
    line-height: 1.6; font-size: 15px; word-wrap: break-word;
  }
  .row.me .bubble { background: #95ec69; }
  .bubble.error { background: #fde2e2; color: #b00; }
  .bubble pre { background: #f4f4f4; padding: 8px; border-radius: 4px; overflow-x: auto; }
  .bubble code { background: #f4f4f4; padding: 1px 4px; border-radius: 3px; font-size: 13px; }
  .bubble pre code { background: none; padding: 0; }
  .meta { font-size: 11px; color: #aaa; margin: 3px 0 0 2px; }
  .system { text-align: center; color: #999; font-size: 12px; margin: 10px 0 16px; }
  .typing { color: #999; font-style: italic; }
  .typing::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .row.cont .avatar { visibility: hidden; height: 0; }
  .row.cont .name { display: none; }
  .row.cont { margin-top: -8px; }

  footer { background: #f7f7f7; border-top: 1px solid #ddd; padding: 10px 12px; }
  #members-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; }
  .chip {
    padding: 3px 10px; border-radius: 12px; cursor: pointer; user-select: none;
    border: 1px solid; background: #fff;
  }
  .chip.off { opacity: .35; text-decoration: line-through; }
  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; border: 1px solid #ccc; border-radius: 6px;
    padding: 8px; font-size: 15px; font-family: inherit; min-height: 40px; max-height: 160px;
  }
  .hint { font-size: 12px; color: #999; margin-top: 6px; }

  /* 设置弹窗 */
  #settings-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    align-items: center; justify-content: center; z-index: 10;
  }
  #settings {
    background: #fff; border-radius: 10px; width: min(720px, 94vw);
    max-height: 90vh; overflow-y: auto; padding: 20px;
  }
  #settings h2 { margin-top: 0; font-size: 18px; }
  #settings h3 { font-size: 15px; margin: 18px 0 8px; }
  #settings label { display: block; font-size: 13px; color: #555; margin: 8px 0 3px; }
  #settings input[type=text], #settings input[type=password], #settings textarea, #settings select {
    width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 5px;
    font-size: 14px; font-family: inherit;
  }
  .member-card {
    border: 1px solid #e3e3e3; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
  }
  .member-card .top { display: flex; gap: 8px; align-items: center; }
  .member-card .top input[type=text] { flex: 1; }
  .member-card input[type=color] { width: 40px; height: 32px; border: none; padding: 0; }
  .small { font-size: 12px; color: #888; }
  .settings-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>

<header>
  <h1>AI 群聊 <span class="sub" id="status">未设置 API Key</span></h1>
  <button onclick="openSettings()">⚙️ 设置</button>
  <button onclick="clearChat()">🗑 清空</button>
</header>

<div id="chat"></div>

<footer>
  <div id="members-bar"></div>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="说点什么… 用 @名字 只叫某个AI回答"></textarea>
    <button id="btn-send" class="primary" onclick="send()">发送</button>
    <button id="btn-debate" onclick="debateRound()" title="让每个AI看完别人的回答后发表评论">💬 互相评论</button>
    <button id="btn-stop" onclick="stopAll()" disabled>⏹ 停止</button>
  </div>
  <div class="hint">Enter 发送，Shift+Enter 换行。点上面的名字可以临时让某个AI"静音"。</div>
</footer>

<!-- ====== 设置弹窗 ====== -->
<div id="settings-bg">
  <div id="settings">
    <h2>设置</h2>

    <label>OpenRouter API Key（只保存在你这台电脑的浏览器里）</label>
    <input type="password" id="set-key" placeholder="sk-or-v1-...">
    <div class="small">去 openrouter.ai 注册 → 充值少量金额 → Keys 页面创建一个 key，粘贴到这里。</div>

    <label>你在群里的名字</label>
    <input type="text" id="set-username">

    <label>发言模式</label>
    <select id="set-mode">
      <option value="natural">自然群聊（随机顺序，能看到彼此，会接话、会@人、没话说就潜水）推荐</option>
      <option value="parallel">同时回答（大家各自独立思考，互相看不到这一轮的回答）</option>
      <option value="sequential">轮流发言（后面的人能看到前面的人刚说了什么）</option>
    </select>

    <h3>群成员 <span class="small" id="model-load-status"></span></h3>
    <div id="member-list"></div>
    <button onclick="addMember()">＋ 添加成员</button>
    <button onclick="resetPersonas()" title="把默认成员的人设恢复成内置的新人设">↺ 恢复默认人设</button>
    <datalist id="model-options"></datalist>

    <div class="settings-actions">
      <button onclick="closeSettings()">取消</button>
      <button class="primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   AI 群聊 —— 一个网页，让多个 AI 在同一个"群"里回答你
   原理：把你的话通过 OpenRouter 的 API 发给不同的模型，
        再把大家的回答按群聊的形式显示出来。
   ===================================================================== */

const API_URL    = "https://openrouter.ai/api/v1/chat/completions";
const MODELS_URL = "https://openrouter.ai/api/v1/models";
const MAX_HISTORY = 40;   // 每次最多把最近 40 条消息发给 AI（太多会更贵更慢）

/* ---------- 默认的群成员 ----------
   modelPattern：用来从最新模型列表里自动挑选"这一家最新的模型"。
   model：实际使用的模型名字（自动挑选后会填进来，你也可以在设置里手动改）。 */
const DEFAULT_MEMBERS = [
  { id: "m1", name: "Claude",   color: "#d97757", enabled: true, model: "",
    modelPattern: "^anthropic/claude-sonnet",
    persona: "群里靠谱又有点话痨的学长型。认真，爱分析，会直说风险，但不是老古板，偶尔冷幽默、自嘲。" },
  { id: "m2", name: "ChatGPT",  color: "#10a37f", enabled: true, model: "",
    modelPattern: "^openai/gpt-\\d",
    persona: "群里的点子王。热情、反应快、爱用emoji，脑洞一个接一个，有时候有点浮夸，被怼了也不生气。" },
  { id: "m3", name: "Gemini",   color: "#4285f4", enabled: false, model: "",
    modelPattern: "^google/gemini-\\d",
    persona: "群里的杠精担当。总能找到别人没想到的角度，口头禅是'但是'，不过杠得有理有据，杠完会给建设性意见。" },
  { id: "m4", name: "DeepSeek", color: "#6b5ce7", enabled: false, model: "",
    modelPattern: "^deepseek/deepseek",
    persona: "群里最接地气的老朋友。熟悉国内情况和网络梗，说话像在饭桌上聊天，爱举身边的例子。" },
];
const OLD_PERSONAS = [   // 旧版本的默认人设，打开新版时自动升级成上面的新人设
  "你思考细致，喜欢把问题拆开讲清楚，也会坦诚指出风险。", "你反应快，点子多，说话直接。",
  "你擅长提供不同角度和实际例子。", "你熟悉中国的情况，说话接地气。",
];

/* ---------- 读写本地存储（浏览器里的小仓库，关掉网页也还在） ---------- */
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

let config = load("aigc-config", {
  apiKey: "", userName: "我", mode: "natural", version: 2,
  members: structuredClone(DEFAULT_MEMBERS),
});
// 从旧版本升级：默认改成"自然群聊"模式，没改过的旧人设换成新人设
if ((config.version || 1) < 2) {
  config.mode = "natural";
  config.members.forEach(m => {
    const def = DEFAULT_MEMBERS.find(d => d.id === m.id);
    if (def && (!m.persona || OLD_PERSONAS.includes(m.persona))) m.persona = def.persona;
  });
  config.version = 2;
  save("aigc-config", config);
}
let messages = load("aigc-messages", []);   // 聊天记录：{sender, text, time, error?, cost?}
let allModels = [];                          // 从 OpenRouter 拉下来的模型列表
let controllers = [];                        // 用来"停止"正在进行的请求
let busy = false;

/* =====================================================================
   1. 拉取最新模型列表，并自动给成员挑模型
   ===================================================================== */
async function loadModels() {
  const statusEl = document.getElementById("model-load-status");
  try {
    statusEl.textContent = "（正在获取模型列表…）";
    const res = await fetch(MODELS_URL);
    const data = await res.json();
    // 过滤掉批处理、免费限流版等特殊变体，按发布时间从新到旧排
    allModels = (data.data || [])
      .filter(m => !m.id.includes(":") && !/batch|image|audio|embed|tts|realtime/i.test(m.id))
      .sort((a, b) => (b.created || 0) - (a.created || 0));

    const dl = document.getElementById("model-options");
    dl.innerHTML = allModels.map(m =>
      `<option value="${m.id}">${escapeHtml(m.name || m.id)}${priceText(m)}</option>`).join("");
    statusEl.textContent = `（共 ${allModels.length} 个模型可选）`;

    // 没选模型的成员，自动挑这一家最新的（设置窗口开着的话，也一起填进去）
    if (autoPickModels(config.members)) { save("aigc-config", config); renderMembersBar(); }
    if (draft && autoPickModels(draft)) renderMemberEditor();
  } catch (e) {
    statusEl.textContent = "（获取模型列表失败，可以手动填写模型名）";
  }
}

// 给还没选模型的成员，按 modelPattern 自动挑这一家最新的标准版。返回：有没有改动
function autoPickModels(members) {
  if (!allModels.length) return false;
  let changed = false;
  for (const mem of members) {
    if (!mem.model && mem.modelPattern) {
      const re = new RegExp(mem.modelPattern, "i");
      const matches = allModels.filter(m => re.test(m.id));
      const standard = matches.filter(m => !/pro|mini|nano|lite|oss|codex|fast|preview/i.test(m.id.split("/")[1]));
      const pool = standard.length ? standard : matches;
      // 只看最新一代（最新发布的 60 天内），再从里面挑最便宜的，聊天够用又省钱
      const newest = pool[0]?.created || 0;
      const recent = pool.filter(m => newest - (m.created || 0) < 60 * 86400);
      const price = m => parseFloat(m.pricing?.prompt) || 0;
      const pick = recent.sort((a, b) => price(a) - price(b))[0];
      if (pick) { mem.model = pick.id; changed = true; }
    }
  }
  return changed;
}

function priceText(m) {
  const p = m.pricing;
  if (!p || p.prompt == null) return "";
  const inM = (parseFloat(p.prompt) * 1e6).toFixed(2);
  const outM = (parseFloat(p.completion) * 1e6).toFixed(2);
  return ` — 输入 $${inM} · 输出 $${outM}（每百万token）`;
}

/* =====================================================================
   2. 给每个 AI 准备"它眼中的聊天记录"
   关键点：每个 AI 只知道自己说过的话是"自己说的"（assistant），
          其他人（你和别的AI）说的话都会以「[名字]: 内容」的形式给它看。
   ===================================================================== */
function systemPromptFor(member) {
  const others = config.members.filter(m => m.enabled && m.id !== member.id).map(m => m.name);
  return `你在一个微信群里和朋友聊天，你不是在当AI助手。群里有真人「${config.userName}」` +
    (others.length ? `，还有 ${others.join("、")}` : "") +
    `。你叫「${member.name}」。你的人设：${member.persona || "普通群友"}

怎么说话：
- 像真人在群里打字：口语、短句，可以用语气词（哈哈哈、啊这、hmm、救命、绝了）和emoji，但别每句都加。
- 真人会连发几条短消息。你一次发 1~3 条，每条之间用单独一行的 /// 隔开，每条一般不超过 60 字。
  只有对方明确要详细内容（方案、步骤、代码）时才发长消息。
- 要有自己的观点和情绪：可以开玩笑、吐槽、接别人的梗、反驳别人、站队。
- 不要说"作为AI"，不要客套，不要列 1.2.3. 的小标题，不要最后总结，不要问"还有什么可以帮你的吗"。
- 想让某个群友接话时可以@他，比如"@${others[0] || config.userName} 你怎么看"，被@的人会回你。别每次都@。
- 别人说过的不要重复。真没什么想说的，就只回复 [PASS]（潜水）。但如果你被@了，或者还没人回复${config.userName}，就必须说点什么。
- 别人的发言以「[名字]: 内容」出现。你直接说话，开头不要写自己的名字，也不要替别人说话。
- 用${config.userName}用的语言聊。`;
}

function senderName(sender) {
  if (sender === "user") return config.userName;
  if (sender === "system") return "主持人";
  const m = config.members.find(x => x.id === sender);
  return m ? m.name : "某位成员";
}

function buildMessagesFor(member, history) {
  const out = [{ role: "system", content: systemPromptFor(member) }];
  for (const msg of history.slice(-MAX_HISTORY)) {
    if (msg.error) continue;                          // 出错的消息不发给AI
    const isSelf = msg.sender === member.id;
    const role = isSelf ? "assistant" : "user";
    const content = isSelf ? msg.text : `[${senderName(msg.sender)}]: ${msg.text}`;
    const last = out[out.length - 1];
    // 连续两条都是 user 的话，合并成一条（有些模型要求 user/assistant 交替）
    if (last.role === role && role !== "system") last.content += "\n\n" + content;
    else out.push({ role, content });
  }
  // 最后一条必须是 user，否则 AI 不知道该回应什么
  if (out[out.length - 1].role !== "user") {
    out.push({ role: "user", content: "[主持人]: 请继续发言，回应群里最新的讨论。" });
  }
  return out;
}

/* =====================================================================
   3. 调用 API
   ===================================================================== */
async function askMember(member, history) {
  const ctrl = new AbortController();
  controllers.push(ctrl);
  const res = await fetch(API_URL, {
    method: "POST",
    signal: ctrl.signal,
    headers: {
      "Authorization": "Bearer " + config.apiKey,
      "Content-Type": "application/json",
      "X-Title": "AI Group Chat",
    },
    body: JSON.stringify({
      model: member.model,
      messages: buildMessagesFor(member, history),
      max_tokens: 1500,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) {
    throw new Error(data.error?.message || `请求失败（HTTP ${res.status}）`);
  }
  const text = data.choices?.[0]?.message?.content?.trim();
  if (!text) throw new Error("模型没有返回内容");
  return { text, cost: data.usage?.cost };
}

/* =====================================================================
   4. 发送消息 / 一轮发言 / 互相评论
   ===================================================================== */
function activeMembers() {
  return config.members.filter(m => m.enabled && m.model);
}

// 解析 @：如果你 @了某些人，只让他们回答
function mentionedMembers(text) {
  const list = activeMembers();
  const hit = config.members.filter(m => m.model && text.includes("@" + m.name));
  return hit.length ? hit : list;
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text || busy) return;
  if (!config.apiKey) { openSettings(); return; }
  const targets = mentionedMembers(text);
  if (!targets.length) { alertInChat("群里没有可用的AI成员，去设置里开启或选个模型吧。"); return; }

  input.value = ""; autoGrow();
  addMessage({ sender: "user", text });
  await runRound(targets);
}

async function debateRound() {
  if (busy) return;
  if (!config.apiKey) { openSettings(); return; }
  const targets = activeMembers();
  if (targets.length < 2) { alertInChat("至少要有两个AI成员才能互相评论。"); return; }
  addMessage({ sender: "system",
    text: "大家看看刚才别人说的：谁说得不对？谁漏了什么？直接@他怼回去或者补充，这一轮不许潜水。" });
  await runRound(targets, "natural");   // 评论环节用自然群聊模式，这样能接上彼此
}

const MAX_CHAIN = 4;   // 一轮里AI之间互相@接话最多几次（防止聊个没完、花太多钱）
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

async function runRound(targets, forceMode) {
  setBusy(true);
  const mode = forceMode || config.mode;
  const said = [];   // 这一轮AI们说的话，用来找谁@了谁
  try {
    if (mode === "parallel") {
      // 同时回答：所有人看到的是同一份"快照"，互相看不到本轮的回答
      const snapshot = [...messages];
      await Promise.all(targets.map(async m => said.push(...await replyFrom(m, snapshot))));
    } else {
      // 自然群聊：随机顺序；轮流发言：按成员顺序。两种都能看到前面的人刚说的话
      const order = mode === "natural" ? shuffle(targets) : targets;
      for (const m of order) {
        if (!busy) break;          // 点了"停止"
        if (mode === "natural") await sleep(400 + Math.random() * 1200);   // 像真人一样停顿一下
        said.push(...await replyFrom(m, messages));
      }
    }
    // 接话：AI们@了谁，谁就接着说（最多 MAX_CHAIN 次）
    let chain = 0;
    for (let i = 0; i < said.length && chain < MAX_CHAIN && busy; i++) {
      for (const target of membersMentionedIn(said[i])) {
        if (chain >= MAX_CHAIN || !busy) break;
        chain++;
        await sleep(500 + Math.random() * 1000);
        said.push(...await replyFrom(target, messages));
      }
    }
  } finally {
    setBusy(false);
  }
}

// 某条AI发言里@到的其他成员
function membersMentionedIn(msg) {
  return activeMembers().filter(m => m.id !== msg.sender && msg.text.includes("@" + m.name));
}

// 让某个成员发言。返回它发出的消息列表（潜水就是空列表）
async function replyFrom(member, history) {
  let typingEl = showTyping(member);
  try {
    const { text, cost } = await askMember(member, history);
    // 拆成多条气泡：AI 用单独一行的 /// 分隔；把 [PASS] 去掉
    const parts = text.replace(/\[PASS\]/gi, "").split(/\n?[ \t]*\/\/\/[ \t]*\n?/)
                      .map(s => s.trim()).filter(Boolean);
    typingEl.remove();
    const out = [];
    for (let i = 0; i < parts.length; i++) {
      if (!busy && i > 0) break;
      if (i > 0) {   // 连发的下一条：先"正在输入…"一会儿，字越多打得越久
        typingEl = showTyping(member);
        await sleep(Math.min(500 + parts[i].length * 35, 2500));
        typingEl.remove();
      }
      const msg = { sender: member.id, text: parts[i], cost: i === parts.length - 1 ? cost : undefined };
      addMessage(msg);
      out.push(msg);
    }
    return out;
  } catch (e) {
    typingEl.remove();
    const msg = e.name === "AbortError" ? "（已停止）" : "出错了：" + e.message;
    addMessage({ sender: member.id, text: msg, error: true });
    return [];
  }
}

function stopAll() {
  controllers.forEach(c => c.abort());
  controllers = [];
  setBusy(false);
}

function setBusy(v) {
  busy = v;
  if (!v) controllers = [];
  document.getElementById("btn-send").disabled = v;
  document.getElementById("btn-debate").disabled = v;
  document.getElementById("btn-stop").disabled = !v;
}

/* =====================================================================
   5. 显示聊天内容
   ===================================================================== */
function addMessage(msg) {
  msg.time = Date.now();
  messages.push(msg);
  save("aigc-messages", messages);
  renderMessage(msg);
}

function alertInChat(text) {
  const div = document.createElement("div");
  div.className = "system";
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
  scrollDown();
}

function renderMessage(msg) {
  const chat = document.getElementById("chat");
  if (msg.sender === "system") {
    const div = document.createElement("div");
    div.className = "system";
    div.textContent = "—— 互相评论环节 ——";
    chat.appendChild(div);
    scrollDown();
    return;
  }
  const isMe = msg.sender === "user";
  const member = config.members.find(m => m.id === msg.sender);
  const name = isMe ? config.userName : (member?.name || "已移除的成员");
  const color = isMe ? "#576b95" : (member?.color || "#999");

  // 同一个人连发的消息：不重复显示头像和名字，像微信一样贴在一起
  const idx = messages.indexOf(msg);
  const prev = idx > 0 ? messages[idx - 1] : null;
  const cont = prev && prev.sender === msg.sender && !msg.error;
  const row = document.createElement("div");
  row.className = "row" + (isMe ? " me" : "") + (cont ? " cont" : "");
  row.innerHTML = `
    <div class="avatar" style="background:${color}">${escapeHtml(name.slice(0, 1))}</div>
    <div class="body">
      <div class="name">${escapeHtml(name)}${member && !isMe ? ` · <span class="small">${escapeHtml(member.model)}</span>` : ""}</div>
      <div class="bubble${msg.error ? " error" : ""}">${isMe ? escapeHtml(msg.text).replace(/\n/g, "<br>") : renderMarkdown(msg.text)}</div>
      ${msg.cost != null ? `<div class="meta">花费 ≈ $${Number(msg.cost).toFixed(4)}</div>` : ""}
    </div>`;
  chat.appendChild(row);
  scrollDown();
}

function showTyping(member) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `
    <div class="avatar" style="background:${member.color}">${escapeHtml(member.name.slice(0, 1))}</div>
    <div class="body"><div class="name">${escapeHtml(member.name)}</div>
    <div class="bubble typing">正在输入</div></div>`;
  document.getElementById("chat").appendChild(row);
  scrollDown();
  return row;
}

function renderAll() {
  document.getElementById("chat").innerHTML = "";
  messages.forEach(renderMessage);
  if (!messages.length) alertInChat("群聊已创建。说句话试试，或者点右上角 ⚙️ 先填 API Key。");
}

function renderMembersBar() {
  const bar = document.getElementById("members-bar");
  bar.innerHTML = "";
  config.members.forEach(m => {
    const chip = document.createElement("span");
    chip.className = "chip" + (m.enabled ? "" : " off");
    chip.style.borderColor = m.color;
    chip.style.color = m.color;
    chip.textContent = m.name + (m.model ? "" : "（未选模型）");
    chip.title = m.model || "去设置里选择模型";
    chip.onclick = () => { m.enabled = !m.enabled; save("aigc-config", config); renderMembersBar(); };
    bar.appendChild(chip);
  });
  document.getElementById("status").textContent =
    config.apiKey ? `${activeMembers().length} 个AI在线 · ${{ natural: "自然群聊", parallel: "同时回答", sequential: "轮流发言" }[config.mode] || ""}`
                  : "未设置 API Key";
}

function clearChat() {
  if (busy) return;
  messages = [];
  save("aigc-messages", messages);
  renderAll();
}

function scrollDown() {
  const chat = document.getElementById("chat");
  chat.scrollTop = chat.scrollHeight;
}

/* 简单的 Markdown 显示：代码块、行内代码、加粗、换行 */
function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => `<pre><code>${code}</code></pre>`);
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/^#{1,6}\s+(.+)$/gm, "<strong>$1</strong>");
  // 不在 <pre> 里的换行变成 <br>
  return html.split(/(<pre>[\s\S]*?<\/pre>)/).map(part =>
    part.startsWith("<pre>") ? part : part.replace(/\n/g, "<br>")).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* =====================================================================
   6. 设置弹窗
   ===================================================================== */
let draft = null;   // 编辑中的成员列表（点"保存"才生效）

function openSettings() {
  draft = structuredClone(config.members);
  document.getElementById("set-key").value = config.apiKey;
  document.getElementById("set-username").value = config.userName;
  document.getElementById("set-mode").value = config.mode;
  renderMemberEditor();
  document.getElementById("settings-bg").style.display = "flex";
}

function closeSettings() {
  draft = null;
  document.getElementById("settings-bg").style.display = "none";
}

function renderMemberEditor() {
  const list = document.getElementById("member-list");
  list.innerHTML = "";
  draft.forEach((m, i) => {
    const card = document.createElement("div");
    card.className = "member-card";
    card.innerHTML = `
      <div class="top">
        <input type="checkbox" ${m.enabled ? "checked" : ""} title="是否在群里">
        <input type="color" value="${m.color}">
        <input type="text" class="f-name" value="${escapeHtml(m.name)}" placeholder="名字">
        <button title="删除">✕</button>
      </div>
      <label>模型（可以输入关键字搜索，例如 claude、gpt、gemini、deepseek、qwen）</label>
      <input type="text" class="f-model" list="model-options" value="${escapeHtml(m.model)}" placeholder="例如 anthropic/...">
      <label>性格 / 角色设定</label>
      <textarea rows="2" class="f-persona">${escapeHtml(m.persona || "")}</textarea>`;
    const [chk, color] = card.querySelectorAll(".top input");
    chk.onchange = () => m.enabled = chk.checked;
    color.oninput = () => m.color = color.value;
    card.querySelector(".f-name").oninput = e => m.name = e.target.value.trim() || "AI";
    card.querySelector(".f-model").oninput = e => m.model = e.target.value.trim();
    card.querySelector(".f-persona").oninput = e => m.persona = e.target.value;
    card.querySelector(".top button").onclick = () => { draft.splice(i, 1); renderMemberEditor(); };
    list.appendChild(card);
  });
}

function resetPersonas() {
  draft.forEach(m => {
    const def = DEFAULT_MEMBERS.find(d => d.id === m.id);
    if (def) m.persona = def.persona;
  });
  renderMemberEditor();
}

function addMember() {
  const colors = ["#e67e22", "#16a085", "#8e44ad", "#c0392b", "#2c3e50", "#d35400"];
  draft.push({ id: "m" + Date.now(), name: "新成员", color: colors[draft.length % colors.length],
               enabled: true, model: "", persona: "" });
  renderMemberEditor();
}

function saveSettings() {
  config.apiKey = document.getElementById("set-key").value.trim();
  config.userName = document.getElementById("set-username").value.trim() || "我";
  config.mode = document.getElementById("set-mode").value;
  config.members = draft;
  draft = null;
  autoPickModels(config.members);
  save("aigc-config", config);
  closeSettings();
  renderMembersBar();
  renderAll();
}

/* =====================================================================
   7. 启动
   ===================================================================== */
const inputEl = document.getElementById("input");
function autoGrow() { inputEl.style.height = "auto"; inputEl.style.height = inputEl.scrollHeight + "px"; }
inputEl.addEventListener("input", autoGrow);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});

renderMembersBar();
renderAll();
loadModels();
if (!config.apiKey) openSettings();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>复调</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   复调 · 音乐厅
   一次群聊 = 一场演出：舞台上一次只演一句，合唱席上谁开口谁发光，
   左边的乐谱是完整记录，你在最下面的指挥台说话。
   ===================================================================== */
:root, html[data-theme="dark"] {
  --bg: #0b0a0c; --panel: #0f0e11; --card: #141215; --card-2: #1b181c; --line: #1f1c1f; --line-2: #2f2a2e;
  --text: #ece6dc; --text-2: #cfc8bd; --muted: #a79f93; --faint: #6f685f;
  --me-bg: #ece6dc; --me-text: #0b0a0c; --accent: #e9d8b4; --accent-text: #0b0a0c;
  --harsh: #f9a8d4; --harsh-bg: #1a1219; --harsh-line: #5a2d4f; --star: #fcd34d; --danger: #fb7185;
  --glow: .5; --shadow: 0 16px 50px rgba(0,0,0,.55); --spot: .08;
  --score-w: 300px; --board-w: 340px; --panel-w: 370px;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif; --ital: "Cormorant Garamond", Georgia, serif;
}
html[data-theme="light"] {
  --bg: #f7f3ec; --panel: #fbf8f3; --card: #ffffff; --card-2: #efe9df; --line: #e7dfd2; --line-2: #d8cebf;
  --text: #1d1a17; --text-2: #3a352f; --muted: #6f675c; --faint: #9a9184;
  --me-bg: #1d1a17; --me-text: #f7f3ec; --accent: #8a6a2f; --accent-text: #ffffff;
  --harsh: #be185d; --harsh-bg: #fdf0f6; --harsh-line: #f3c2da; --star: #b45309; --danger: #e11d48;
  --glow: .3; --shadow: 0 16px 50px rgba(60,40,10,.14); --spot: .12;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.6 Inter, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--text); }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.it { font-family: var(--ital); font-style: italic; font-size: 1.12em; }
[hidden] { display: none !important; }

.btn { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 7px 16px; color: var(--text-2); }
.btn:hover { border-color: var(--muted); color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.small { padding: 5px 12px; font-size: 13px; }
.pill { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
.pill:hover, .pill.on { border-color: var(--accent); color: var(--accent); }
.icon-btn { width: 34px; height: 34px; border: none; background: transparent; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--muted); flex-shrink: 0; }
.icon-btn:hover { background: var(--card-2); color: var(--text); }
.icon-btn svg { width: 17px; height: 17px; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 13px; flex-shrink: 0; }
.seg button { border: none; background: transparent; border-radius: 999px; padding: 4px 13px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--me-bg); color: var(--me-text); }
.seg button .it { margin-right: 3px; }

.avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 700; font-size: 13px; color: var(--c, #999); border: 1.5px solid var(--c, #999); background: var(--bg); user-select: none; }
.avatar.sm { width: 28px; height: 28px; font-size: 11px; }

/* =====================================================================
   左：乐谱（完整记录）+ 演出列表
   ===================================================================== */
#score { width: var(--score-w); border-right: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; min-height: 0; background: var(--bg); z-index: 20; }
.score-head { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 22px 12px; }
.score-head b { font-family: var(--serif); font-size: 18px; letter-spacing: 2px; }
#chat { flex: 1; overflow-y: auto; padding: 0 12px 16px; position: relative; }
.mov { font-size: 11px; letter-spacing: 2px; color: var(--faint); padding: 14px 10px 6px; display: flex; align-items: center; gap: 8px; }
.mov::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.s-item { position: relative; display: block; width: 100%; text-align: left; border: none; background: transparent; padding: 7px 10px; border-radius: 10px; color: inherit; }
.s-item:hover { background: var(--card); }
.s-item.on { background: var(--card-2); }
.s-item.cont { padding-top: 0; }
.s-item.cont .s-who { display: none; }
.s-who { display: flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: 1.2px; font-weight: 600; color: var(--c); }
.s-who i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); display: inline-block; }
.s-who .star { color: var(--star); font-style: normal; letter-spacing: 0; }
.s-text { font-size: 13px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.s-item.me .s-text { color: var(--text); }
.s-item.err .s-text { color: var(--danger); }
.s-atts { font-size: 12px; color: var(--muted); }
.s-actions { position: absolute; right: 6px; top: 4px; display: none; gap: 1px; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 1px; z-index: 2; }
.s-item:hover .s-actions, .s-item.show-actions .s-actions { display: flex; }
.s-actions span { font-size: 11px; padding: 1px 7px; border-radius: 999px; color: var(--text-2); cursor: pointer; }
.s-actions span:hover { background: var(--line-2); }
#new-pill { position: sticky; bottom: 6px; left: 0; margin: 6px auto 0; display: none; background: var(--accent); color: var(--accent-text); border: none; border-radius: 999px; padding: 4px 14px; font-size: 12px; }
.shows { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; max-height: 32vh; overflow-y: auto; }
.show { display: flex; align-items: center; gap: 8px; border: none; background: transparent; text-align: left; padding: 6px 8px; border-radius: 8px; color: var(--muted); font-size: 13px; }
.show:hover { background: var(--card); color: var(--text); }
.show.on { color: var(--text); }
.show span:first-child { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.show .dot { width: 7px; height: 7px; border-radius: 50%; background: #f472b6; }
.show .live { font-size: 11px; color: var(--accent); }
.shows-foot { display: flex; align-items: center; gap: 8px; padding: 4px 8px 0; }
.shows-foot .new { flex: 1; border: none; background: none; text-align: left; color: var(--muted); font-size: 13px; padding: 4px 0; }
.shows-foot .new:hover { color: var(--text); }
#me-btn { width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--me-bg); color: var(--me-text); font-weight: 700; font-size: 12px; padding: 0; }

/* =====================================================================
   中：舞台
   ===================================================================== */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; overflow: hidden; }
#spot { position: absolute; top: 46%; width: 640px; height: 640px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--sc, #ece6dc); opacity: var(--spot); filter: blur(100px); transition: left 1.2s ease, background-color 1.2s ease; pointer-events: none; left: 50%; }
#beam { position: absolute; bottom: 190px; width: 1px; height: 42%; transform: translateX(-50%); background: linear-gradient(to top, color-mix(in srgb, var(--sc, #ece6dc) 65%, transparent), transparent); transition: left 1.2s ease, opacity .6s; pointer-events: none; left: 50%; opacity: 0; }
#beam.on { opacity: 1; }
#chat-head { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 20px 32px 0; z-index: 2; }
#score-btn { display: none; }
.head-title { flex: 1; min-width: 180px; }
.head-title .t { font-family: var(--serif); font-weight: 700; font-size: 20px; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-title .s { font-size: 12px; color: var(--muted); letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#views { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
#stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.motif { position: relative; width: 100%; max-width: 860px; margin: 0 auto; padding: 26px 32px 0; }
.motif .label { font-size: 11px; letter-spacing: 3px; color: var(--muted); }
.motif .q { font-family: var(--serif); font-size: 19px; color: var(--text-2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.motif .thumbs { display: flex; gap: 6px; margin-top: 6px; }
.motif .thumbs img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; cursor: zoom-in; border: 1px solid var(--line-2); }
.motif .thumbs .file-chip { font-size: 12px; padding: 4px 8px; }
.boards { position: relative; flex: 1; min-height: 220px; width: 100%; max-width: 860px; margin: 0 auto; }
.layer { position: absolute; left: 32px; right: 32px; top: 50%; transform: translateY(calc(-50% + 26px)); opacity: 0; transition: opacity .8s ease, transform .8s ease; pointer-events: none; max-height: 100%; display: flex; flex-direction: column; }
.layer.on { opacity: 1; transform: translateY(-50%); pointer-events: auto; }
.layer.out { transform: translateY(calc(-50% - 26px)); }
.who { font-size: 12px; letter-spacing: 3px; font-weight: 600; color: var(--c); margin-bottom: 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.who .to { color: var(--muted); letter-spacing: 1px; font-weight: 400; }
.who .star { color: var(--star); letter-spacing: 0; }
.verse { font-family: var(--serif); font-weight: 600; letter-spacing: .5px; overflow-y: auto; overflow-wrap: anywhere; min-height: 0; }
.verse p { margin: 0 0 .35em; }
.verse.xl { font-size: 40px; line-height: 1.4; }
.verse.l { font-size: 30px; line-height: 1.5; }
.verse.m { font-size: 22px; line-height: 1.7; font-weight: 400; }
.verse.s { font-size: 16px; line-height: 1.85; font-weight: 400; font-family: Inter, "Noto Sans SC", sans-serif; letter-spacing: 0; }
.verse pre { font-size: 13px; background: var(--card); padding: 10px 12px; border-radius: 10px; overflow-x: auto; font-family: ui-monospace, Consolas, monospace; font-weight: 400; }
.verse code { font-size: .8em; background: var(--card); padding: 1px 5px; border-radius: 5px; font-family: ui-monospace, Consolas, monospace; }
.verse pre code { background: none; padding: 0; font-size: inherit; }
.verse .at { font-weight: 700; }
.verse.err { color: var(--danger); font-size: 18px; font-weight: 400; }
.rest { text-align: center; color: var(--muted); }
.rest .big { font-family: var(--serif); font-size: 26px; color: var(--text); margin-bottom: 8px; }
.stage-foot { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; max-width: 860px; margin: 0 auto; padding: 0 32px 6px; min-height: 30px; }
#breath { flex: 1; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.breath { display: inline-flex; align-items: center; gap: 8px; }
.bars { display: inline-flex; gap: 3px; align-items: center; height: 16px; }
.bars i { width: 3px; height: 16px; border-radius: 2px; background: var(--c); transform-origin: bottom; animation: breathe 1.1s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: .15s; } .bars i:nth-child(3) { animation-delay: .3s; } .bars i:nth-child(4) { animation-delay: .45s; }
@keyframes breathe { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
.nav { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.nav .latest { border: 1px solid var(--line-2); background: none; border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--accent); }

/* 合唱席 */
#choir { position: relative; height: 128px; flex-shrink: 0; }
#choir::before { content: ""; position: absolute; left: 50%; top: 22px; width: min(760px, 86%); height: 380px; transform: translateX(-50%); border-radius: 50%; border: 1px solid var(--line); pointer-events: none; }
.seat { position: absolute; transform: translate(-50%, 0); display: flex; flex-direction: column; align-items: center; gap: 5px; border: none; background: none; padding: 0; transition: transform .8s ease; }
.seat .avatar { width: 44px; height: 44px; font-size: 16px; opacity: .55; transition: all .8s ease; }
.seat .lbl { font-size: 11px; letter-spacing: 1px; color: var(--faint); transition: color .8s; white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
.seat.off .avatar { opacity: .2; border-style: dashed; }
.seat.lead { transform: translate(-50%, -12px); }
.seat.lead .avatar, .seat.sing .avatar { opacity: 1; box-shadow: 0 0 0 7px color-mix(in srgb, var(--c) 14%, transparent), 0 0 40px color-mix(in srgb, var(--c) calc(var(--glow) * 110%), transparent); }
.seat.lead .lbl, .seat.sing .lbl { color: var(--c); }
.seat.ping .avatar { animation: ping 1.4s ease-out 1; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 70%, transparent); } 100% { box-shadow: 0 0 0 18px transparent; } }
.seat:hover .avatar { opacity: 1; }

/* 指挥台 */
#composer-wrap { position: relative; padding: 0 24px 20px; flex-shrink: 0; z-index: 3; }
#composer-inner { width: min(620px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.tools-row { display: flex; gap: 18px; font-size: 12px; flex-wrap: wrap; justify-content: center; position: relative; }
.chip-btn { border: none; background: none; color: var(--muted); padding: 0; font-size: 12px; }
.chip-btn:hover { color: var(--text); }
.chip-btn:disabled { opacity: .4; cursor: not-allowed; }
#solo-pop { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 8px; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); padding: 5px; min-width: 200px; z-index: 10; }
#composer { position: relative; width: 100%; background: var(--card); border: 1px solid var(--line-2); border-radius: 26px; padding: 5px 5px 5px 18px; transition: border-color .15s; }
#composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line-2)); }
#composer.dragover { border-color: var(--accent); }
#reply-bar, #pending-atts { display: none; margin: 6px 8px 4px 0; }
#reply-bar { font-size: 13px; color: var(--muted); align-items: center; gap: 8px; border-left: 2px solid var(--accent); padding: 2px 4px 2px 10px; }
#reply-bar span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pending-atts { flex-wrap: wrap; gap: 8px; }
.pending { position: relative; }
.pending img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; display: block; }
.pending .x { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: var(--text); color: var(--bg); font-size: 11px; line-height: 20px; padding: 0; }
.compose-row { display: flex; align-items: flex-end; gap: 6px; }
.podium { font-family: var(--serif); color: var(--accent); font-size: 14px; align-self: center; flex-shrink: 0; }
#input { flex: 1; resize: none; border: none; outline: none; background: transparent; padding: 9px 4px; min-height: 40px; max-height: 160px; line-height: 1.5; }
#send-btn { width: 40px; height: 40px; border: none; border-radius: 50%; background: var(--me-bg); color: var(--me-text); display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
#send-btn svg { width: 16px; height: 16px; }
#send-btn.stop { background: var(--danger); color: #fff; }
#mention-pop { position: absolute; bottom: 100%; left: 0; margin-bottom: 8px; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); padding: 5px; min-width: 230px; display: none; z-index: 10; }
.mention-item { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; }
.mention-item.active, .mention-item:hover { background: var(--line-2); }
.file-chip { display: inline-flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line-2); font-size: 13px; max-width: 260px; }
.file-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 声部发来的图片和文件 */
.atts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.atts .art { margin: 0; display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
.atts .art img { max-width: 260px; max-height: 260px; border-radius: 14px; border: 1px solid var(--line-2); cursor: zoom-in; display: block; object-fit: contain; background: var(--card); }
.atts.big .art img { max-width: min(460px, 100%); max-height: 34vh; }
.atts .art figcaption { display: flex; gap: 10px; align-items: baseline; font-size: 12px; color: var(--muted); font-family: Inter, "Noto Sans SC", sans-serif; font-weight: 400; letter-spacing: 0; }
.gfile { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line-2); font-family: Inter, "Noto Sans SC", sans-serif; font-size: 14px; font-weight: 400; letter-spacing: 0; }
.gfile .gname { font-weight: 600; }
.gfile .chip-btn { color: var(--accent); }
.s-thumb { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; margin-top: 4px; border: 1px solid var(--line-2); }

/* 乐谱视图：完整记录铺满主界面 */
#fullscore { flex: 1; overflow-y: auto; padding: 12px 32px 20px; }
#full-list { max-width: 820px; margin: 0 auto; }
#full-list .s-item { padding: 10px 12px; }
#full-list .s-item.cont { padding-top: 0; }
#full-list .s-text { -webkit-line-clamp: unset; display: block; font-size: 15px; line-height: 1.75; color: var(--text); }
#full-list .s-text p { margin: 0; }
#full-list .s-text pre { background: var(--card); padding: 10px 12px; border-radius: 10px; overflow-x: auto; font-size: 13px; }
#full-list .s-text code { background: var(--card); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
#full-list .s-text pre code { background: none; padding: 0; }
#full-list .s-who { font-size: 12px; }
#full-list .s-item.me { background: color-mix(in srgb, var(--text) 5%, transparent); }
body.view-score #choir, body.view-score #beam { display: none; }
body.view-score #score #chat { display: none; }
body.view-score #score .shows { flex: 1; max-height: none; border-top: none; }

/* ---------- 全景（沙盘） ---------- */
#sandbox { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.sb-field { flex: 1; position: relative; overflow: hidden; min-height: 0; }
.sb-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 24px; border-top: 1px solid var(--line); flex-shrink: 0; }
.sb-guide { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.7; max-width: 300px; }
.sb-guide b { color: var(--text-2); font-weight: 600; }
.ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid var(--line); pointer-events: none; }
.ring.r3 { border-style: dashed; }
.core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 240px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.core .label { font-size: 11px; letter-spacing: 3px; color: var(--muted); }
.core .q { font-family: var(--serif); font-size: 18px; font-weight: 700; line-height: 1.45; }
.core .sun { width: 8px; height: 8px; border-radius: 50%; background: var(--text); box-shadow: 0 0 0 6px color-mix(in srgb, var(--text) 8%, transparent), 0 0 30px color-mix(in srgb, var(--text) 50%, transparent); }
.node { position: absolute; transform: translate(-50%, -50%); width: 210px; text-align: left; border-radius: 14px; padding: 10px 13px; background: color-mix(in srgb, var(--c) 10%, var(--bg)); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); color: var(--text); font-size: 14px; line-height: 1.5; animation: drift 7s ease-in-out infinite alternate; will-change: translate; }
.node:hover, .node:focus-visible { z-index: 3; border-color: var(--c); animation-play-state: paused; }
.node.inner { box-shadow: 0 0 18px color-mix(in srgb, var(--c) calc(var(--glow) * 40%), transparent); font-size: 15px; }
.node.outer { width: 170px; font-size: 12px; opacity: .55; background: transparent; border-color: var(--line-2); }
.node.harsh { background: var(--harsh-bg); border-color: var(--harsh-line); }
.node .nh { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; margin-bottom: 2px; }
.node .nh b { color: var(--c); }
.node .nh span { color: var(--muted); white-space: nowrap; }
.node .nh .hs { color: var(--harsh); }
.node .nh .st { color: var(--star); }
@keyframes drift { from { translate: 0 -3px; } to { translate: 0 3px; } }
@media (prefers-reduced-motion: reduce) { .node, .bars i { animation: none; } .layer, #spot, #beam, .seat { transition: none; } }
.legend { flex: 1; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); min-width: 0; }
.legend div { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.sandbox-actions { display: flex; gap: 8px; margin-left: auto; }

/* =====================================================================
   右：主题板（观点板）
   ===================================================================== */
#board { width: var(--board-w); flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; z-index: 30; }
.board-head { display: flex; align-items: center; gap: 8px; padding: 18px 12px 8px 20px; }
.board-head b { flex: 1; font-family: var(--serif); font-size: 17px; letter-spacing: 1px; }
#board-body { flex: 1; overflow-y: auto; padding: 4px 20px 18px; display: flex; flex-direction: column; gap: 14px; }
.b-question { font-family: var(--serif); font-size: 14px; color: var(--text-2); border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.b-group { display: flex; flex-direction: column; gap: 6px; }
.b-title { font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--accent); }
.b-group.harsh .b-title { color: var(--harsh); }
.b-item { text-align: left; background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 8px 11px; font-size: 13px; color: var(--text); width: 100%; }
.b-item:hover { border-color: var(--muted); }
.b-item b { color: var(--c); font-weight: 600; margin-right: 4px; }
.b-group.harsh .b-item { background: var(--harsh-bg); border-color: var(--harsh-line); }
.b-item.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.b-note { font-size: 12px; color: var(--muted); line-height: 1.6; }
.b-link { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-2); background: var(--card); border-radius: 10px; padding: 6px 8px 6px 10px; }
.b-link span { flex: 1; }
.b-actions { display: flex; gap: 8px; padding: 12px 20px 18px; border-top: 1px solid var(--line); }
.b-actions .btn { flex: 1; font-size: 13px; }
.b-saved summary { cursor: pointer; font-size: 13px; color: var(--text-2); padding: 4px 0; }

/* =====================================================================
   群设置面板
   ===================================================================== */
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w); max-width: 100vw; background: var(--panel); border-left: 1px solid var(--line-2); box-shadow: var(--shadow); transform: translateX(105%); transition: transform .24s ease; z-index: 40; display: flex; flex-direction: column; }
#panel.open { transform: none; }
.panel-head { display: flex; align-items: center; padding: 18px 12px 10px 22px; font-family: var(--serif); font-weight: 700; font-size: 17px; }
.panel-head span { flex: 1; }
#panel-body { flex: 1; overflow-y: auto; padding: 0 20px 24px; }
.section-title { font-size: 11px; font-weight: 600; letter-spacing: 2px; color: var(--faint); margin: 20px 2px 8px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 5px 2px; }
.field input[type=text], .field input[type=password], .field textarea, .field select { width: 100%; border: 1px solid var(--line-2); background: var(--card); border-radius: 10px; padding: 8px 10px; outline: none; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 90px; }
.segmented { display: flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 3px; }
.segmented button { flex: 1; border: none; background: transparent; border-radius: 999px; padding: 5px 4px; font-size: 13px; color: var(--muted); }
.segmented button.on { background: var(--me-bg); color: var(--me-text); }
.mode-desc { font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
.member-card { border: 1px solid var(--line-2); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
.member-card.disabled .mc-head { opacity: .45; }
.mc-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; }
.mc-head:hover, .member-card.open .mc-head { background: var(--card); }
.mc-head .info { flex: 1; min-width: 0; }
.mc-head .n { font-weight: 600; }
.mc-head .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); margin-left: 4px; }
.mc-edit { display: none; padding: 4px 12px 14px; border-top: 1px solid var(--line); }
.member-card.open .mc-edit { display: block; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatch.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--text); }
.row2 { display: flex; gap: 8px; }
.row2 .field { flex: 1; }
.row2 .field.narrow { flex: 0 0 76px; }
.model-info { font-size: 12px; color: var(--muted); margin: 5px 2px 0; }
.switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line-2); border-radius: 22px; transition: .2s; cursor: pointer; }
.switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::before { transform: translateX(18px); }

.overlay { position: fixed; inset: 0; background: rgba(5, 4, 6, .62); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
.overlay.show { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--line-2); border-radius: 20px; width: min(480px, 100%); max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: var(--shadow); }
.modal h2 { margin: 0 0 16px; font-family: var(--serif); font-size: 20px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.key-row { display: flex; gap: 6px; }
.key-row input { flex: 1; }
#lightbox img { max-width: 94vw; max-height: 90vh; border-radius: 14px; }
#scrim { position: fixed; inset: 0; background: rgba(5,4,6,.45); z-index: 15; display: none; }
#toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-90px); background: var(--me-bg); color: var(--me-text); padding: 8px 18px; border-radius: 999px; font-size: 14px; z-index: 60; transition: transform .25s; max-width: 90vw; }
#toast.show { transform: translateX(-50%) translateY(0); }

/* =====================================================================
   窄屏
   ===================================================================== */
@media (max-width: 1100px) {
  #board { position: fixed; top: 0; right: 0; bottom: 0; box-shadow: var(--shadow); max-width: 100vw; }
}
@media (max-width: 860px) {
  #score { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-105%); transition: transform .22s; box-shadow: var(--shadow); max-width: 86vw; }
  body.score-open #score { transform: none; }
  body.score-open #scrim { display: block; }
  #score-btn { display: inline-flex; }
  #chat-head { padding: 12px 12px 0; gap: 8px; }
  .head-title { min-width: 0; flex: 1 1 50%; order: 1; }
  #score-btn { order: 0; } #more-btn { order: 2; }
  #tempo-seg { order: 3; } #view-seg { order: 4; } #board-btn { order: 5; margin-left: auto; }
  .seg button { padding: 4px 9px; }
  .seg button .it { display: none; }
  .motif, .stage-foot { padding-left: 18px; padding-right: 18px; }
  .layer { left: 18px; right: 18px; }
  .verse.xl { font-size: 30px; } .verse.l { font-size: 24px; } .verse.m { font-size: 19px; }
  #choir { height: 104px; }
  .seat .avatar { width: 38px; height: 38px; }
  #composer-wrap { padding: 0 10px calc(12px + env(safe-area-inset-bottom)); }
  #board, #panel { width: 100vw; }
  .node { width: 150px; font-size: 12px; }
  .legend { display: none; }
}
</style>
</head>
<body>

<!-- ============ 左：乐谱 + 演出列表 ============ -->
<aside id="score">
  <div class="score-head"><b>乐谱</b><span class="it muted">Score</span></div>
  <div id="chat">
    <div id="messages"></div>
    <button id="new-pill" onclick="scrollToBottom(true)">有新乐句 ↓</button>
  </div>
  <div class="shows">
    <div id="group-rail"></div>
    <div class="shows-foot">
      <button class="new" onclick="newGroup()">＋ 新的演出</button>
      <button id="me-btn" title="设置" aria-label="设置" onclick="openSettings()"></button>
    </div>
  </div>
</aside>
<div id="scrim" onclick="closeScore()"></div>

<!-- ============ 中：舞台 ============ -->
<main id="main">
  <div id="spot" aria-hidden="true"></div>
  <div id="beam" aria-hidden="true"></div>
  <header id="chat-head">
    <button class="icon-btn" id="score-btn" aria-label="乐谱和演出列表" onclick="openScore()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="head-title">
      <div class="t" id="head-title"></div>
      <div class="s" id="head-sub"></div>
    </div>
    <div class="seg" id="tempo-seg"></div>
    <div class="seg" id="view-seg">
      <button data-v="chat" onclick="setView('chat')" title="一次只演一段">舞台</button>
      <button data-v="score" onclick="setView('score')" title="完整记录铺满主界面，方便翻看和复制">乐谱</button>
      <button data-v="sandbox" onclick="setView('sandbox')" title="观点按被接话的多少排布">全景</button>
    </div>
    <button class="pill" id="board-btn" onclick="toggleBoard()" title="按立场整理大家的观点">主题板</button>
    <button class="icon-btn" id="more-btn" title="演出设置" aria-label="演出设置" onclick="togglePanel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
    </button>
  </header>

  <div id="views">
    <div id="stage">
      <div class="motif" id="motif"></div>
      <div class="boards">
        <div class="layer" id="layer-a"></div>
        <div class="layer" id="layer-b"></div>
      </div>
      <div class="stage-foot">
        <div id="breath"></div>
        <div class="nav" id="stage-nav"></div>
      </div>
    </div>
    <div id="fullscore" hidden><div id="full-list"></div></div>
    <div id="sandbox" hidden></div>
  </div>

  <div id="choir"></div>

  <div id="composer-wrap">
    <div id="composer-inner">
      <div class="tools-row">
        <button class="chip-btn" id="debate-btn" onclick="debateRound()" title="让每个声部听完别人的发言后互相评论"><span class="it">Fuga</span> · 让他们互相评论</button>
        <button class="chip-btn" id="solo-btn" onclick="toggleSolo()" title="只请一位声部回答"><span class="it">Solo</span> · 只请一位</button>
        <div id="solo-pop" hidden></div>
      </div>
      <div id="composer">
        <div id="mention-pop"></div>
        <div id="reply-bar"><span id="reply-text"></span><button class="icon-btn" style="width:24px;height:24px" onclick="setReply(null)" aria-label="取消引用">✕</button></div>
        <div id="pending-atts"></div>
        <div class="compose-row">
          <span class="podium">指挥</span>
          <textarea id="input" rows="1" placeholder="起一个新主题，或 @ 一位声部"></textarea>
          <button class="icon-btn" title="发送图片或文件（图片、PDF、文本/代码文件）" aria-label="添加图片或文件" onclick="document.getElementById('file-input').click()" style="align-self:center">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
          </button>
          <button id="send-btn" title="发送" aria-label="发送" onclick="onSendBtn()"></button>
        </div>
      </div>
      <input type="file" id="file-input" multiple hidden
        accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.java,.c,.cpp,.cs,.go,.rs,.sql,.xml,.yaml,.yml,.log">
    </div>
  </div>
</main>

<!-- ============ 右：主题板 ============ -->
<aside id="board" hidden>
  <div class="board-head">
    <b>主题板</b>
    <span class="small muted">按立场分组</span>
    <button class="icon-btn" title="重新整理" aria-label="重新整理" onclick="generateInsights()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
    </button>
    <button class="icon-btn" aria-label="关闭主题板" onclick="toggleBoard(false)">✕</button>
  </div>
  <div id="board-body"></div>
  <div class="b-actions">
    <button class="btn" id="link-btn" onclick="startLink()">连线两个观点</button>
    <button class="btn primary" onclick="saveThread()">保存今晚线索</button>
  </div>
</aside>

<!-- ============ 群设置面板 ============ -->
<aside id="panel">
  <div class="panel-head"><span>演出设置</span><button class="icon-btn" aria-label="关闭" onclick="togglePanel(false)">✕</button></div>
  <div id="panel-body"></div>
</aside>

<!-- ============ 设置弹窗 ============ -->
<div class="overlay" id="settings-ov">
  <div class="modal">
    <h2>设置</h2>
    <div class="field">
      <label>OpenRouter API Key（只保存在这台设备上）</label>
      <div class="key-row">
        <input type="password" id="set-key" placeholder="sk-or-v1-…">
        <button class="btn small" onclick="toggleKeyVisible()">👁</button>
      </div>
      <div class="small muted" style="margin:4px 2px 0">在 openrouter.ai → Keys 创建。key 只显示一次，建议存进密码管理器。</div>
    </div>
    <div class="row2">
      <div class="field narrow"><label>头像</label><input type="text" id="set-avatar" maxlength="4"></div>
      <div class="field"><label>你在群里的名字</label><input type="text" id="set-username"></div>
    </div>
    <div class="field">
      <label>外观</label>
      <div class="segmented" id="set-theme">
        <button data-v="auto">跟随系统</button><button data-v="light">浅色</button><button data-v="dark">深色</button>
      </div>
    </div>
    <div class="field">
      <label>声音（每个声部一个五声音阶的音）</label>
      <div style="display:flex;gap:12px;align-items:center">
        <label class="switch" style="margin:0"><input type="checkbox" id="set-sound"><span></span></label>
        <input type="range" id="set-volume" min="0" max="1" step="0.05" style="flex:1" aria-label="音量">
        <button class="btn small" type="button" onclick="previewSound()">试听</button>
      </div>
    </div>
    <div class="field">
      <label>让声部画图（每张大约几美分，比聊天贵）</label>
      <div style="display:flex;gap:12px;align-items:center">
        <label class="switch" style="margin:0"><input type="checkbox" id="set-images"><span></span></label>
        <input type="text" id="set-image-model" list="image-model-options" placeholder="画图模型，留空自动挑选" style="flex:1">
      </div>
      <datalist id="image-model-options"></datalist>
    </div>
    <div class="field">
      <label>模型列表</label>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="small muted" id="model-status" style="flex:1"></span>
        <button class="btn small" onclick="loadModels(true)">刷新</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="overlay" id="confirm-ov">
  <div class="modal" style="width:min(380px,100%)">
    <div id="confirm-text" style="margin-bottom:6px"></div>
    <div class="modal-actions">
      <button class="btn" id="confirm-no">取消</button>
      <button class="btn primary" id="confirm-yes">确定</button>
    </div>
  </div>
</div>

<!-- 文件预览 -->
<div class="overlay" id="file-ov" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal" style="width:min(760px,100%)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><h2 id="file-title" style="margin:0;flex:1;font-size:17px"></h2>
      <div id="file-actions" style="display:flex;gap:8px"></div>
      <button class="icon-btn" aria-label="关闭" onclick="$('file-ov').classList.remove('show')">✕</button></div>
    <pre id="file-body" style="white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:14px;max-height:65vh;overflow:auto;font-size:13px;margin:0"></pre>
  </div>
</div>

<!-- 图片查看 -->
<div class="overlay" id="lightbox" onclick="this.classList.remove('show')"><img alt=""></div>
<div id="toast"></div>

<datalist id="model-options"></datalist>

<script>
/* =====================================================================
   复调 v0.4 —— 一场由几个 AI 声部合唱的群聊
   - 多个群，每个群有自己的成员、人设和聊天记录
   - 通过 OpenRouter 调用各家模型；可以发图片、PDF、文本文件
   - 数据都存在本机：设置在 localStorage，群和聊天记录在 IndexedDB（容量大，放得下图片）
   ===================================================================== */

const API_URL = "https://openrouter.ai/api/v1/chat/completions";
const MODELS_URL = "https://openrouter.ai/api/v1/models";
const MAX_HISTORY = 40;     // 每次最多把最近 40 条消息发给 AI
const IMAGE_HISTORY = 6;    // 只有最近 6 条消息里的图片/PDF 会真的发给 AI（更早的只说"发过一张图"），省钱
const MAX_CHAIN = 3;        // 一轮里AI之间互相@接话最多几次
const MAX_SPEAKERS = 3;     // 自然群聊模式下，没被@的时候每轮最多几个人说话（其他人这轮安静）
const MAX_BUBBLES = 2;      // 一个AI一次最多发几条气泡，多出来的合并到最后一条
const PALETTE = ["#d97757", "#10a37f", "#4285f4", "#6b5ce7", "#e8a33d", "#e05d8c", "#2bb5c4", "#7a8a99"];

/* ---------- 默认成员和人设模板 ---------- */
const PERSONA_TEMPLATES = {
  "靠谱学长": "群里靠谱又有点话痨的学长型。认真，爱分析，会直说风险，但不是老古板，偶尔冷幽默、自嘲。",
  "点子王": "群里的点子王。热情、反应快、爱用emoji，脑洞一个接一个，有时候有点浮夸，被怼了也不生气。",
  "杠精": "群里的杠精担当。总能找到别人没想到的角度，口头禅是'但是'，不过杠得有理有据，杠完会给建设性意见。",
  "接地气老朋友": "群里最接地气的老朋友。熟悉国内情况和网络梗，说话像在饭桌上聊天，爱举身边的例子。",
  "知心大姐姐": "知心大姐姐，温柔但不软弱。说话轻声细语，会先接住对方的情绪，再说道理，比如\"我能理解你为什么会这么想\"\"先别急，我们慢慢捋一捋\"。她不会一味顺着人说好话：别人的想法不靠谱时，她会温和但很清楚地指出问题，像姐姐那样\"我得跟你说句实话\"。比起\"该怎么做\"，她更在意\"你自己真正想要什么\"，常常反问一句，让人自己想明白。群里有人吵起来，她会出来打圆场，也会替说话少的人说两句。偶尔用\"～\"和🫶，但不过分甜腻。",
  "毒舌损友": "嘴很毒的损友，专门戳破幻想、吐槽不靠谱的计划，损得好笑但有分寸、不说脏话。吐槽完一定会认真给一个更靠谱的替代方案。",
  "温哥华学姐": "在温哥华读了三年书的学姐，熟悉加拿大留学、打工、租房、选课、PR 这些事，说话实在，爱分享自己踩过的坑。涉及政策和规定时会提醒大家去官网核实。",
  "冷静分析师": "说话简短冷静，只讲数据和逻辑，常问'证据是什么''成本多少''最坏情况是什么'，偶尔冷不丁来一句很好笑的话。",

function lsLoad(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function lsSave(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

// IndexedDB：浏览器里的小数据库，每个群存成一条记录
let dbPromise = null;
function db() {
  return dbPromise ||= new Promise((resolve, reject) => {
    const req = indexedDB.open("aigc", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("groups", { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbAll() {
  const d = await db();
  return new Promise((res, rej) => {
    const q = d.transaction("groups").objectStore("groups").getAll();
    q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error);
  });
}
async function idbPut(value) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction("groups", "readwrite");
    t.objectStore("groups").put(value);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
async function idbDelete(id) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction("groups", "readwrite");
    t.objectStore("groups").delete(id);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
function saveGroup(g, touch = true) {
  if (touch) g.updatedAt = Date.now();
  idbPut(g).catch(e => toast("保存失败：" + e.message));
}

function upgradeMember(m) {

async function loadModels(manual) {
  $("model-status").textContent = "正在获取…";
  try {

    const data = await res.json();
    allModels = (data.data || [])
      .filter(m => !m.id.includes(":") && !/batch|embed|tts|realtime|audio/i.test(m.id))
      .sort((a, b) => (b.created || 0) - (a.created || 0));
    $("model-options").innerHTML = allModels.map(m =>
      `<option value="${esc(m.id)}">${esc(m.name || m.id)}${canSeeImages(m.id) ? " · 可看图" : ""}${priceText(m)}</option>`).join("");
    $("model-status").textContent = `共 ${allModels.length} 个模型可选`;
    for (const g of groups) if (autoPickModels(g.members)) saveGroup(g, false);
    renderHeader(); renderPanel();
    if (manual) toast("模型列表已更新");
  } catch {
    $("model-status").textContent = "获取失败（可以手动填写模型名）";
  }
}
function modelInfo(id) { return allModels.find(m => m.id === id); }
function canSeeImages(id) {
  const mods = modelInfo(id)?.architecture?.input_modalities;
  return mods ? mods.includes("image") : true;   // 不知道的话就试试
}
function priceText(m) {
  const p = m.pricing;
  if (!p || p.prompt == null) return "";
  return ` · $${(parseFloat(p.prompt) * 1e6).toFixed(2)} / $${(parseFloat(p.completion) * 1e6).toFixed(2)} 每百万token`;
}
// 给还没选模型的成员，自动挑这一家最新一代里最便宜的标准版
function autoPickModels(members) {
  if (!allModels.length) return false;
  let changed = false;
  for (const mem of members) {
    if (mem.model || !mem.modelPattern) continue;
    const re = new RegExp(mem.modelPattern, "i");
    const matches = allModels.filter(m => re.test(m.id));
    // 按"词"判断，不然 ge-mini 会被当成 mini 版；会画图的模型不当聊天声部
    const variant = m => m.id.split("/")[1].split(/[-_.:]/).some(t => /^(pro|mini|nano|lite|oss|codex|fast|preview|image|audio|vision|tts)$/i.test(t));
    const canChat = m => !(m.architecture?.output_modalities || []).includes("image");
    const standard = matches.filter(m => canChat(m) && !variant(m));
    const pool = standard.length ? standard : matches.filter(canChat).length ? matches.filter(canChat) : matches;
    const newest = pool[0]?.created || 0;
    const price = m => parseFloat(m.pricing?.prompt) || 0;
    const pick = pool.filter(m => newest - (m.created || 0) < 60 * 86400).sort((a, b) => price(a) - price(b))[0];
    if (pick) { mem.model = pick.id; changed = true; }
  }
  return changed;
}

function senderName(sender, g = current) {
  if (sender === "user") return config.userName;
  if (sender === "system") return "主持人";
  return g.members.find(x => x.id === sender)?.name || "已离场的声部";
}
// 同一个人在 5 分钟内连发、且不是引用回复 → 算同一段"乐句"
function isCont(prev, msg) {
  return !!(prev && msg && prev.sender === msg.sender && msg.sender !== "system" && msg.sender !== "user" && !msg.error && !prev.error
    && !msg.replyTo && msg.time - prev.time < 5 * 60 * 1000);
}
// 这条消息在回应谁：引用了谁，或者 @ 了谁
function targetOf(msg, g = current) {
  if (msg.replyTo) {
    const q = g.messages.find(m => m.id === msg.replyTo);
    if (q && q.sender !== msg.sender) return q.sender;
  }
  const m = g.members.find(x => x.id !== msg.sender && (msg.text || "").includes("@" + x.name));
  if (m) return m.id;
  if ((msg.text || "").includes("@" + config.userName)) return "user";
  return null;
}

   ===================================================================== */
let stageFocus = null;   // 你在乐谱里点了某一句 → 舞台停在那里；null = 跟着最新的走
let shownId = null;      // 舞台上现在演的是哪一段（段首消息 id）

// 每一段"乐句"的段首（AI 的发言，连发的算一段）
function stanzaHeads(g = current) {
  const out = [];
  g.messages.forEach((m, i) => {
    if (m.sender !== "user" && m.sender !== "system" && !isCont(g.messages[i - 1], m)) out.push(m.id);
  });
  return out;
}
function stanza(headId, g = current) {
  const i = g.messages.findIndex(m => m.id === headId);
  if (i < 0) return [];
  const out = [g.messages[i]];
  for (let j = i + 1; j < g.messages.length && isCont(g.messages[j - 1], g.messages[j]); j++) out.push(g.messages[j]);
  return out;
}
function currentStanzaId() {
  if (stageFocus && current.messages.some(m => m.id === stageFocus)) return stageFocus;
  stageFocus = null;
  const starts = roundStarts();
  const from = starts.length ? starts[starts.length - 1] : 0;
  const heads = stanzaHeads();
  const idxOf = id => current.messages.findIndex(m => m.id === id);
  const inRound = heads.filter(id => idxOf(id) > from || !starts.length);
  return inRound[inRound.length - 1] || null;
}
function verseSize(len) { return len <= 40 ? "xl" : len <= 90 ? "l" : len <= 220 ? "m" : "s"; }
function verseHtml(msg) {
  const body = msg.text ? `<p>${colorAts(renderMarkdown(msg.text))}</p>` : "";
  return body + attHtml(msg, true);
}

function renderStage(force) {
  if (!current) return;
  const id = currentStanzaId();
  const lines = stanza(id);
  const head = lines[0];
  const msgs = current.messages;

  // 主题：这一段所在乐章的开头那句话
  const headIdx = head ? msgs.indexOf(head) : msgs.length;
  let motifMsg = null;
  for (let i = Math.min(headIdx, msgs.length - 1); i >= 0; i--) if (msgs[i].sender === "user" || msgs[i].sender === "system") { motifMsg = msgs[i]; break; }
  const mAtts = motifMsg?.attachments?.length ? `<div class="thumbs">${motifMsg.attachments.map(a => a.type === "image"
    ? `<img src="${a.dataUrl}" alt="" onclick="viewImage(this.src)">` : `<span class="file-chip">📄 <span>${esc(a.name)}</span></span>`).join("")}</div>` : "";
  $("motif").innerHTML = !motifMsg ? `<div class="label">主 题</div><div class="q muted">还没有主题</div>`
    : motifMsg.sender === "system" ? `<div class="label">赋 格</div><div class="q">每位声部回应别人刚才说的话</div>`
    : `<div class="label">主 题</div>${motifMsg.text ? `<div class="q">${esc(motifMsg.text)}</div>` : ""}${mAtts}`;

  // 舞台上的这一段
  const typingIds = [...(typing.get(current.id) || [])];
  let html, key;
  if (head) {
    const member = current.members.find(m => m.id === head.sender);
    const order = current.members.filter(m => m.enabled).indexOf(member);
    const target = targetOf(head);
    const len = lines.reduce((s, m) => s + (m.text || "").length, 0) + (lines.some(m => m.attachments?.length) ? 60 : 0);
    html = `<div class="who" style="--c:${member?.color || "#999"}">${esc(member?.name || "已离场的声部")}${order >= 0 ? " · 第" + (NUM[order] || order + 1) + "声部" : ""}
        ${target ? `<span class="to">→ ${esc(senderName(target))}</span>` : ""}${lines.some(m => m.starred) ? '<span class="star">★</span>' : ""}</div>
      <div class="verse ${head.error ? "err" : verseSize(len)}">${lines.map(verseHtml).join("")}</div>`;
    key = head.id;
  } else {
    const waiting = typingIds.length || busyGroups.has(current.id);
    html = `<div class="rest">${!msgs.length ? `<div class="big">演出还没开始</div><div>在下面的指挥台起一个主题，声部们会轮流登台</div>`
      : waiting ? `<div class="big">声部们正在酝酿</div><div>第一句马上就来</div>`
      : `<div class="big">台上很安静</div><div>还没有人回应这个主题，试试 @ 一位声部</div>`}</div>`;
    key = "rest:" + (!msgs.length ? 0 : waiting ? 1 : 2);
  }
  if (force || key !== shownId) {
    swapLayer(html);
  } else {
    const on = document.querySelector(".layer.on");   // 同一段又多了一句：原地更新，不再播放切换动画
    if (on) on.innerHTML = html;
  }
  shownId = key;

  renderBreath();
  renderNav();
  renderChoir();
  highlightScore();
}
function swapLayer(html) {
  const a = $("layer-a"), b = $("layer-b");
  const cur = a.classList.contains("on") ? a : b.classList.contains("on") ? b : null;
  const nxt = cur === a ? b : a;
  nxt.style.transition = "none";
  nxt.classList.remove("on", "out");
  nxt.innerHTML = html;
  void nxt.offsetHeight;
  nxt.style.transition = "";
  requestAnimationFrame(() => {
    if (cur) { cur.classList.remove("on"); cur.classList.add("out"); }
    nxt.classList.add("on");
  });
}
function renderBreath() {
  const ids = [...(typing.get(current.id) || [])];
  $("breath").innerHTML = ids.map(id => {
    const m = current.members.find(x => x.id === id);
    return m ? `<span class="breath" style="--c:${m.color}"><span class="bars"><i></i><i></i><i></i><i></i></span>${esc(m.name)} 正在酝酿…</span>` : "";
  }).join("");
}
function renderNav() {
  const heads = stanzaHeads();
  const id = currentStanzaId();
  const i = heads.indexOf(id);
  if (!heads.length) { $("stage-nav").innerHTML = ""; return; }
  $("stage-nav").innerHTML = `
    <button class="icon-btn" aria-label="上一句" onclick="stageStep(-1)" ${i <= 0 ? "disabled" : ""}>‹</button>
    <span>${i + 1} / ${heads.length}</span>
    <button class="icon-btn" aria-label="下一句" onclick="stageStep(1)" ${i < 0 || i >= heads.length - 1 ? "disabled" : ""}>›</button>
    ${stageFocus ? `<button class="latest" onclick="followLatest()">回到最新</button>` : ""}`;
}
function stageStep(delta) {
  const heads = stanzaHeads();
  if (!heads.length) return;
  let i = heads.indexOf(currentStanzaId());
  if (i < 0) i = heads.length;
  const j = Math.max(0, Math.min(heads.length - 1, i + delta));
  stageFocus = j === heads.length - 1 ? null : heads[j];
  renderStage();
  document.querySelector(`#messages .s-item[data-id="${heads[j]}"]`)?.scrollIntoView({ block: "nearest" });
}
function followLatest() { stageFocus = null; renderStage(); scrollToBottom(); }
// 在乐谱里点一句 → 舞台演那一段
function focusMsg(id) {
  const msgs = current.messages;
  let i = msgs.findIndex(m => m.id === id);
  if (i < 0) return;
  if (msgs[i].sender === "user" || msgs[i].sender === "system") {
    const next = msgs.slice(i + 1).find(m => m.sender !== "user" && m.sender !== "system");
    if (!next) return;
    i = msgs.indexOf(next);
  }
  while (i > 0 && isCont(msgs[i - 1], msgs[i])) i--;
  const heads = stanzaHeads();
  stageFocus = heads[heads.length - 1] === msgs[i].id ? null : msgs[i].id;
  if (view !== "chat") setView("chat"); else renderStage();
  if (window.innerWidth <= 860) closeScore();
}

/* =====================================================================
   合唱席：弧形排开，舞台上的那位升起来发光，正在酝酿的也亮着
   ===================================================================== */
function seatPositions(n) {
  const out = [];
  for (let k = 0; k < n; k++) {
    const t = Math.PI * (1.14 + (n === 1 ? 0.36 : 0.72 * k / (n - 1)));
    out.push([50 + 38 * Math.cos(t), 74 + 62 * Math.sin(t)]);
  }
  return out;
}
function renderChoir() {
  if (!current) return;
  const list = current.members.slice(0, 8);
  const pos = seatPositions(list.length);
  const headMsg = stanza(currentStanzaId())[0];
  const typingIds = typing.get(current.id) || new Set();
  const lead = headMsg?.sender || [...typingIds][0] || null;
  $("choir").innerHTML = list.map((m, k) => {
    const cls = [m.enabled ? "" : "off", m.id === lead ? "lead" : "", typingIds.has(m.id) ? "sing" : ""].join(" ");
    const lbl = typingIds.has(m.id) ? "酝酿中" : m.id === lead ? "正在演唱" : m.name;
    return `<button class="seat ${cls}" data-id="${m.id}" style="--c:${m.color};left:${pos[k][0]}%;top:${pos[k][1]}px"
      title="${esc(m.name)}${m.enabled ? "" : "（暂时离场）"} · 点一下修改" onclick="openMember('${m.id}')">${avatarHtml(m)}<span class="lbl">${esc(lbl)}</span></button>`;
  }).join("");
  // 聚光灯和光柱跟着台上的人
  const li = list.findIndex(m => m.id === lead);
  const spot = $("spot"), beam = $("beam");
  spot.style.left = li >= 0 ? pos[li][0] + "%" : "50%";
  spot.style.setProperty("--sc", li >= 0 ? list[li].color : "var(--text)");
  beam.style.left = li >= 0 ? pos[li][0] + "%" : "50%";
  beam.style.setProperty("--sc", li >= 0 ? list[li].color : "var(--text)");
  beam.classList.toggle("on", li >= 0);
}

function addMessage(g, msg) {
  msg.id ||= uid("msg_");
  msg.time = Date.now();
  const prev = g.messages[g.messages.length - 1];
  g.messages.push(msg);
  saveGroup(g);
  if (g === current) {
    const box = $("messages");
    if (g.messages.length === 1) box.innerHTML = "";
    const nearBottom = isNearBottom();
    if (msg.sender === "user" || msg.sender === "system") box.appendChild(movEl(msg, roundStarts(g).length));
    if (msg.sender !== "system") box.appendChild(scoreItemEl(msg, prev));
    if (nearBottom || msg.sender === "user") scrollToBottom(); else $("new-pill").style.display = "block";
    if (view === "score") {
      const fl = $("full-list"), f = $("fullscore");
      if (g.messages.length === 1) fl.innerHTML = "";
      const near = f.scrollHeight - f.scrollTop - f.clientHeight < 160;
      if (msg.sender === "user" || msg.sender === "system") fl.appendChild(movEl(msg, roundStarts(g).length));
      if (msg.sender !== "system") fl.appendChild(scoreItemEl(msg, prev, true));
      if (near || msg.sender === "user") f.scrollTop = f.scrollHeight;
    }
    soundForMessage(msg, prev);
    if (msg.sender === "user" || msg.sender === "system") { stageFocus = null; renderHeader(); }
    renderStage();

    if (msg.sender !== "user" && msg.sender !== "system") {   // @ 了谁，谁的席位闪一下
      const t = targetOf(msg, g);
      if (t && t !== "user") pingSeat(t);
    }
    markBoardStale();
  } else if (msg.sender !== "system") {
    g.unread = (g.unread || 0) + 1;
  }
  renderSidebar();
  return msg;
}

function renderTyping() { if (!current) return; if (!currentStanzaId()) renderStage(); else { renderBreath(); renderChoir(); } }   // 台上还空着时，整台刷新（比如本轮结束、大家都潜水了）

/* =====================================================================
   沙盘视图：问题在中心，观点越被大家接话就越靠近中心
   注意：位置只看"其他成员有没有接这句话"，不看你喜不喜欢，免得AI迎合你
   ===================================================================== */
function sandboxPoints(g = current) {
  const msgs = g.messages;
  const starts = roundStarts(g);
  const from = starts.length > 3 ? starts[starts.length - 3] : 0;   // 只看最近 3 轮
  const points = [];
  for (let i = from; i < msgs.length; i++) {
    const m = msgs[i];
    if (m.sender === "user" || m.sender === "system" || m.error || !m.text) continue;
    const last = points[points.length - 1];
    if (last && isCont(msgs[i - 1], m) && msgs[i - 1].sender === m.sender) { last.text += " " + m.text; last.ids.push(m.id); last.starred ||= m.starred; continue; }
    points.push({ id: m.id, ids: [m.id], sender: m.sender, text: m.text, starred: !!m.starred, idx: i });
  }
  // 接话的人：之后引用了它、@了它的作者、或者被它@到后紧接着回话的成员
  for (const p of points) {
    const name = senderName(p.sender, g);
    const repliers = new Set();
    for (let j = p.idx + 1; j < msgs.length && j < p.idx + 12; j++) {
      const n = msgs[j];
      if (n.sender === p.sender || n.sender === "system" || n.sender === "user" || n.error) continue;
      if (p.ids.includes(n.replyTo) || (n.text || "").includes("@" + name)) repliers.add(n.sender);
      else if (n.sender !== "user" && p.text.includes("@" + senderName(n.sender, g))) repliers.add(n.sender);
    }
    p.score = repliers.size;
  }
  const harshIds = new Set();
  (g.insights?.groups || []).filter(x => x.kind === "harsh").forEach(x => x.items.forEach(it => harshIds.add(it.id)));
  points.forEach(p => p.harsh = p.ids.some(id => harshIds.has(id)));
  return points.sort((a, b) => b.score - a.score || b.idx - a.idx);
}

let sandboxTimer = null;
function scheduleSandbox() { clearTimeout(sandboxTimer); sandboxTimer = setTimeout(() => view === "sandbox" && renderSandbox(), 400); }
// 每一圈最多放几张、内圈每个成员最多占几张（防止"话多的人占满中心"，也防止卡片叠成一团）
const RING_CAP = [4, 6, 5];
const INNER_PER_MEMBER = 1, MIDDLE_PER_MEMBER = 2;
function renderSandbox() {
  const box = $("sandbox");
  const pts = sandboxPoints();
  // 问题核心：优先用观点板总结的问题，否则用最近 3 轮里你说得最长的那句话
  const starts = roundStarts();
  const recentQs = current.messages.slice(starts.length > 3 ? starts[starts.length - 3] : 0)
    .filter(m => m.sender === "user" && m.text).map(m => m.text.replace(/@\S+\s?/g, "").trim());
  const longest = recentQs.sort((a, b) => b.length - a.length)[0];
  const q = current.insights?.question || (longest ? longest.slice(0, 40) : current.name);

  // 分圈：内圈 = 2 人以上接话（每个成员最多 1 张），中圈 = 1 人接话，外圈 = 没人接
  const inner = [], middle = [], outer = [], perMember = {};
  for (const p of pts) {
    if (p.score >= 2 && inner.length < RING_CAP[0] && (perMember[p.sender] || 0) < INNER_PER_MEMBER) {
      inner.push(p); perMember[p.sender] = (perMember[p.sender] || 0) + 1;
    } else if (p.score >= 1) middle.push(p);
    else outer.push(p);
  }
  middle.sort((a, b) => b.score - a.score || b.idx - a.idx);
  // 中圈每个成员最多 2 张，多出来的挪到外圈
  const midCount = {}, keptMid = [];
  for (const p of middle) {
    if (keptMid.length < RING_CAP[1] && (midCount[p.sender] || 0) < MIDDLE_PER_MEMBER) { keptMid.push(p); midCount[p.sender] = (midCount[p.sender] || 0) + 1; }
    else outer.push(p);
  }
  middle.length = 0; middle.push(...keptMid);
  // 按沙盘的大小决定最多放几张卡：地方小就少放，先砍外圈，再砍中圈
  const fw = box.clientWidth || 900, fh = (box.clientHeight || 600) - 60;
  let room = Math.max(3, Math.floor((fw * fh) / (230 * 100 * 2.4))) - inner.length;
  middle.splice(Math.max(0, Math.min(middle.length, room)));
  room -= middle.length;
  outer.sort((a, b) => b.idx - a.idx);
  let shownOuter = outer.slice(0, Math.max(0, Math.min(RING_CAP[2], room)));
  if (!inner.length && !middle.length && shownOuter.length) { middle.push(...shownOuter); shownOuter = []; }   // 还没人互相接话：先正常显示
  const hidden = pts.length - inner.length - middle.length - shownOuter.length;   // 没放进沙盘的
  const noReplies = pts.length && !pts.some(p => p.score > 0);

  let field = `<div class="ring" style="width:280px;height:280px"></div><div class="ring" style="width:560px;height:560px"></div>
    <div class="ring r3" style="width:880px;height:880px"></div>
    <div class="core"><span class="label">问题核心</span><div class="q">${esc(q || "还没有问题")}</div><span class="sun"></span>`;
  if (pts.length < 3) {
    field += `<div class="sb-guide">${pts.length ? "观点还不多，" : ""}沙盘会把<b>最近 3 轮</b>里大家的观点摆在这里。<br>
      先回到对话多聊几轮，被越多成员接话的观点会越靠近中心。</div>`;
  }
  field += `</div>`;
  const radius = [[21, 25], [32, 33], [42, 40]];   // 横向 %，纵向 %
  [inner, middle, shownOuter].forEach((list, r) => list.forEach((p, k) => {
    const ang = (k / Math.max(list.length, 1)) * Math.PI * 2 + r * 0.9 + 0.4;
    const x = 50 + Math.cos(ang) * radius[r][0], y = 50 + Math.sin(ang) * radius[r][1];
    const m = current.members.find(x => x.id === p.sender);
    const cls = r === 0 ? "inner" : r === 2 ? "outer" : "";
    const tags = [p.harsh ? '<span class="hs">刺耳但有用</span>' : "", p.score ? `<span>${p.score} 人接话</span>` : "", p.starred ? '<span class="st">★</span>' : ""].filter(Boolean).join(" ");
    field += `<button class="node ${cls} ${p.harsh ? "harsh" : ""}" style="--c:${m?.color || "#999"};left:${Math.max(11, Math.min(89, x))}%;top:${Math.max(11, Math.min(89, y))}%;animation-delay:${-k * 1.3}s"
      onclick="jumpTo('${p.id}')" title="点一下回到对话里这条消息"><div class="nh"><b>${esc(senderName(p.sender))}</b><span>${tags}</span></div>${esc(p.text.length > 60 ? p.text.slice(0, 60) + "…" : p.text)}</button>`;
  }));
  box.innerHTML = `<div class="sb-field">${field}</div>
    <div class="sb-bar">
      <div class="legend">
        ${noReplies ? "<div>大家还没互相接话，点「让他们互相评论」看看谁会往中心靠</div>" : ""}
        <div><i style="background:var(--text)"></i>越靠中心 = 越多成员接话</div>
        <div><i style="border:1px solid var(--faint)"></i>靠边变淡 = 没人接</div>
        <div><span style="color:var(--star)">★</span>你的星标，不改位置</div>
        <div>每人内圈最多 1 张、中圈 2 张</div>
        ${hidden > 0 ? `<div>还有 ${hidden} 条没显示</div>` : ""}
      </div>
      <div class="sandbox-actions">
        <button class="btn small" onclick="setView('chat')">回到对话</button>
        <button class="btn small primary" onclick="toggleBoard(true);generateInsights()">总结共识</button>
      </div>
    </div>`;
  spreadNodes(box.querySelector(".sb-field"));
}

// 把叠在一起的卡片互相推开，也不让它们盖住中间的问题
function spreadNodes(field) {
  const W = field.clientWidth, H = field.clientHeight;
  if (!W || !H) return;
  const core = field.querySelector(".core");
  const items = [...field.querySelectorAll(".node")].map(el => ({
    el, x: parseFloat(el.style.left) / 100 * W, y: parseFloat(el.style.top) / 100 * H, w: el.offsetWidth + 14, h: el.offsetHeight + 12,
  }));
  const fixed = { x: W / 2, y: H / 2, w: core.offsetWidth + 24, h: core.offsetHeight + 24, fixed: true };
  const all = [...items, fixed];
  for (let iter = 0; iter < 120; iter++) {
    let moved = false;
    for (const a of items) {
      for (const b of all) {
        if (a === b) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        const ox = (a.w + b.w) / 2 - Math.abs(dx), oy = (a.h + b.h) / 2 - Math.abs(dy);
        if (ox <= 0 || oy <= 0) continue;
        moved = true;
        const share = b.fixed ? 1 : 0.5;
        if (ox < oy) { const s = Math.sign(dx) || 1; a.x += s * ox * share; if (!b.fixed) b.x -= s * ox * share; }
        else { const s = Math.sign(dy) || 1; a.y += s * oy * share; if (!b.fixed) b.y -= s * oy * share; }
      }
    }
    for (const a of items) {   // 不出边界
      a.x = Math.min(Math.max(a.x, a.w / 2 + 4), W - a.w / 2 - 4);
      a.y = Math.min(Math.max(a.y, a.h / 2 + 4), H - a.h / 2 - 4);
    }
    if (!moved) break;
  }
  for (const a of items) { a.el.style.left = a.x + "px"; a.el.style.top = a.y + "px"; }
}

}

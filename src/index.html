}

/* =====================================================================
   对话视图：按时间滚动；早的轮次和太长的消息自动收起
   ===================================================================== */
const KEEP_ROUNDS = 2;        // 最新几轮保持展开
const LONG_CHARS = 160;       // 超过这么多字算长消息，先只显示 3 行

function senderName(sender, g = current) {
  if (sender === "user") return config.userName;
  if (sender === "system") return "主持人";
  return g.members.find(x => x.id === sender)?.name || "已退群的成员";
}

function renderChat() {
  const box = $("messages");
  box.innerHTML = "";
  const msgs = current.messages;
  if (!msgs.length) {
    box.innerHTML = `<div class="empty-hint"><div class="big">群聊已就绪</div>
      <div>说句话试试，或者 @ 某个人单独问</div>
      <div class="small" style="margin-top:6px">点顶部的圆桌头像可以改人设、换模型</div></div>`;
    renderTyping();
    return;
  }
  const starts = roundStarts();
  let from = 0;
  if (!current._expanded && starts.length > KEEP_ROUNDS) {
    from = starts[starts.length - KEEP_ROUNDS];
    const hidden = msgs.slice(0, from);
    const who = [...new Set(hidden.filter(m => m.sender !== "user" && m.sender !== "system").map(m => senderName(m.sender)))];
    const bar = document.createElement("button");
    bar.className = "fold-bar";
    const n = starts.length - KEEP_ROUNDS;
    bar.innerHTML = `<span>第 ${n > 1 ? "1–" + n : "1"} 轮 · ${hidden.length} 条消息已收起${who.length ? " · " + esc(who.slice(0, 4).join("、")) : ""}</span><b>展开</b>`;
    bar.onclick = () => { current._expanded = true; const h = $("chat").scrollHeight - $("chat").scrollTop; renderChat(); $("chat").scrollTop = $("chat").scrollHeight - h; };
    box.appendChild(bar);
  }
  for (let i = from; i < msgs.length; i++) box.appendChild(messageEl(msgs[i], i > from ? msgs[i - 1] : null));
  renderTyping();
  scrollToBottom(true);
}

// 同一个人在 5 分钟内连发、且不是引用回复 → 算"连发"，只显示一次名字
function isCont(prev, msg) {
  return !!(prev && msg && prev.sender === msg.sender && msg.sender !== "system" && !msg.error && !prev.error
    && !msg.replyTo && msg.time - prev.time < 5 * 60 * 1000);
}
// 这条消息在回应谁：引用了谁，或者 @ 了谁
function targetOf(msg, g = current) {
  if (msg.replyTo) {
    const q = g.messages.find(m => m.id === msg.replyTo);
    if (q && q.sender !== msg.sender) return q.sender;
  }
  const m = g.members.find(x => x.id !== msg.sender && (msg.text || "").includes("@" + x.name));
  if (m) return m.id;
  if ((msg.text || "").includes("@" + config.userName)) return "user";
  return null;
}

function messageEl(msg, prev) {
  const frag = document.createDocumentFragment();
  if (!prev || msg.time - prev.time > 5 * 60 * 1000) {
    const t = document.createElement("div");
    t.className = "time-sep"; t.textContent = longTime(msg.time);
    frag.appendChild(t);
  }
  if (msg.sender === "system") {
    const d = document.createElement("div");
    d.className = "sys-msg"; d.dataset.id = msg.id;
    d.innerHTML = `<span>互相评论环节</span>`;
    frag.appendChild(d);
    return frag;
  }
  const isMe = msg.sender === "user";
  const member = current.members.find(m => m.id === msg.sender);
  const name = isMe ? config.userName : (member?.name || "已退群的成员");
  const color = isMe ? "var(--text)" : (member?.color || "#999");
  const cont = isCont(prev, msg);
  const target = isMe ? null : targetOf(msg);
  const long = !isMe && !msg.error && (msg.text || "").length > LONG_CHARS;

  let quote = "";
  if (msg.replyTo) {
    const q = current.messages.find(m => m.id === msg.replyTo);
    quote = `<div class="quote">${q ? esc(senderName(q.sender) + "：" + snippet(q)) : "（原消息已删除）"}</div>`;
  }
  const atts = msg.attachments?.length ? `<div class="atts">${msg.attachments.map(a =>
    a.type === "image" ? `<img src="${a.dataUrl}" alt="${esc(a.name)}" onclick="viewImage(this.src)">`
      : `<div class="file-chip">📄 <span>${esc(a.name)}</span><span class="muted">${fmtSize(a.size)}</span></div>`).join("")}</div>` : "";
  let body = msg.text ? (isMe ? esc(msg.text).replace(/\n/g, "<br>") : renderMarkdown(msg.text)) : "";
  if (body && !isMe) for (const m of current.members) {
    body = body.split("@" + esc(m.name)).join(`<span class="at" style="color:${m.color}">@${esc(m.name)}</span>`);
  }

  const row = document.createElement("div");
  row.className = "msg" + (isMe ? " me" : "") + (cont ? " cont" : "") + (long ? " long clamped" : "");
  row.dataset.id = msg.id;
  row.style.setProperty("--c", color);
  const actions = `<div class="msg-actions">
      <span class="meta">${shortTime(msg.time)}${member && !isMe ? " · " + esc(shortModel(member.model)) : ""}${msg.cost != null ? ` · $${Number(msg.cost).toFixed(4)}` : ""}</span>
      ${msg.text ? `<button onclick="copyMsg('${msg.id}')">复制</button>` : ""}
      ${msg.error ? "" : `<button onclick="quoteMsg('${msg.id}')">引用</button>`}
      ${!isMe && !msg.error ? `<button onclick="toggleStar('${msg.id}')">${msg.starred ? "取消星标" : "标星"}</button>` : ""}
      <button onclick="deleteMsg('${msg.id}')">删除</button>
    </div>`;
  if (isMe) {
    row.innerHTML = `<div class="msg-body">${atts}${body || quote ? `<div class="bubble">${quote}${body}</div>` : ""}</div>${actions}`;
  } else {
    row.innerHTML = `<span class="dot"></span>
      <div class="msg-body">
        <div class="msg-name">${esc(name)}${target ? `<span class="to">→ ${esc(senderName(target))}</span>` : ""}${msg.starred ? '<span class="star">★</span>' : ""}</div>
        ${atts}
        ${body || quote ? `<div class="text${msg.error ? " error" : ""}">${quote}<div class="text-inner">${body}</div>${long ? `<button class="more" onclick="expandMsg(this)">展开全文</button>` : ""}</div>` : ""}
      </div>${actions}`;
  }
  row.addEventListener("contextmenu", e => {
    e.preventDefault();
    document.querySelectorAll(".msg.show-actions").forEach(x => x !== row && x.classList.remove("show-actions"));
    row.classList.toggle("show-actions");
  });
  frag.appendChild(row);
  return frag;
}
function expandMsg(btn) {
  const row = btn.closest(".msg");
  const open = row.classList.toggle("clamped");
  btn.textContent = open ? "展开全文" : "收起";
}

function addMessage(g, msg) {
  msg.id ||= uid("msg_");
  msg.time = Date.now();
  const prev = g.messages[g.messages.length - 1];
  g.messages.push(msg);
  saveGroup(g);
  if (g === current) {
    if (view === "chat") {
      if (g.messages.length === 1) $("messages").innerHTML = "";
      const nearBottom = isNearBottom();
      $("messages").appendChild(messageEl(msg, prev));
      if (nearBottom || msg.sender === "user") scrollToBottom(); else $("new-pill").style.display = "block";
    } else renderSandbox();
    // 圆桌：AI @了谁 / 引用了谁，就从它连一条线过去
    if (msg.sender !== "user" && msg.sender !== "system") {
      const t = targetOf(msg, g);
      if (t && t !== "user") flashLink(msg.sender, t);
    }
    if (msg.sender === "user" || msg.sender === "system") renderHeader();
    markBoardStale();
  } else if (msg.sender !== "system") {
    g.unread = (g.unread || 0) + 1;
  }
  renderSidebar();
  return msg;
}

function renderTyping() {
  const ids = typing.get(current.id) || new Set();
  $("typing-area").innerHTML = [...ids].map(id => {
    const m = current.members.find(x => x.id === id);
    return m ? `<div class="typing-row" style="--c:${m.color}"><span class="dot"></span>${esc(m.name)} 正在输入…</div>` : "";
  }).join("");
}
function setTyping(g, memberId, on) {
  if (!typing.has(g.id)) typing.set(g.id, new Set());
  const s = typing.get(g.id);
  on ? s.add(memberId) : s.delete(memberId);
  if (g === current) {
    renderRoundtable();
    if (view === "chat") { const nb = isNearBottom(); renderTyping(); if (nb) scrollToBottom(); }
  }
}

const chatEl = () => $("chat");
function isNearBottom() { const c = chatEl(); return c.scrollHeight - c.scrollTop - c.clientHeight < 140; }
function scrollToBottom(instant) {
  const c = chatEl();
  c.scrollTo({ top: c.scrollHeight, behavior: instant ? "auto" : "smooth" });
  $("new-pill").style.display = "none";
}
// 从沙盘或观点板跳回对话里的某条消息
function jumpTo(id) {
  if (!current.messages.some(m => m.id === id)) return toast("这条消息已经被删掉了");
  current._expanded = true;
  if (window.innerWidth <= 1100) toggleBoard(false);
  setView("chat");
  const el = $("messages").querySelector(`.msg[data-id="${id}"]`);
  if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1700); }
}
function toggleStar(id) {
  const m = findMsg(id);
  if (!m) return;
  m.starred = !m.starred;
  saveGroup(current, false);
  renderView();
  toast(m.starred ? "已标星（只是你的记号，不会影响别人的发言）" : "已取消星标");
}

/* =====================================================================
   沙盘视图：问题在中心，观点越被大家接话就越靠近中心
   注意：位置只看"其他成员有没有接这句话"，不看你喜不喜欢，免得AI迎合你
   ===================================================================== */
function sandboxPoints(g = current) {
  const msgs = g.messages;
  const starts = roundStarts(g);
  const from = starts.length > 3 ? starts[starts.length - 3] : 0;   // 只看最近 3 轮
  const points = [];
  for (let i = from; i < msgs.length; i++) {
    const m = msgs[i];
    if (m.sender === "user" || m.sender === "system" || m.error || !m.text) continue;
    const last = points[points.length - 1];
    if (last && isCont(msgs[i - 1], m) && msgs[i - 1].sender === m.sender) { last.text += " " + m.text; last.ids.push(m.id); last.starred ||= m.starred; continue; }
    points.push({ id: m.id, ids: [m.id], sender: m.sender, text: m.text, starred: !!m.starred, idx: i });
  }
  // 接话的人：之后引用了它、@了它的作者、或者被它@到后紧接着回话的成员
  for (const p of points) {
    const name = senderName(p.sender, g);
    const repliers = new Set();
    for (let j = p.idx + 1; j < msgs.length && j < p.idx + 12; j++) {
      const n = msgs[j];
      if (n.sender === p.sender || n.sender === "system" || n.error) continue;
      if (p.ids.includes(n.replyTo) || (n.text || "").includes("@" + name)) repliers.add(n.sender);
      else if (n.sender !== "user" && p.text.includes("@" + senderName(n.sender, g))) repliers.add(n.sender);
    }
    p.score = repliers.size;
  }
  const harshIds = new Set();
  (g.insights?.groups || []).filter(x => x.kind === "harsh").forEach(x => x.items.forEach(it => harshIds.add(it.id)));
  points.forEach(p => p.harsh = p.ids.some(id => harshIds.has(id)));
  return points.sort((a, b) => b.score - a.score || b.idx - a.idx).slice(0, 12);
}

function renderSandbox() {
  const box = $("sandbox");
  const pts = sandboxPoints();
  // 问题核心：优先用观点板总结的问题，否则用最近 3 轮里你说得最长的那句话
  const starts = roundStarts();
  const recentQs = current.messages.slice(starts.length > 3 ? starts[starts.length - 3] : 0)
    .filter(m => m.sender === "user" && m.text).map(m => m.text.replace(/@\S+\s?/g, "").trim());
  const longest = recentQs.sort((a, b) => b.length - a.length)[0];
  const q = current.insights?.question || (longest ? longest.slice(0, 40) : current.name);
  let html = `<div class="ring" style="width:280px;height:280px"></div><div class="ring" style="width:560px;height:560px"></div>
    <div class="ring r3" style="width:880px;height:880px"></div>
    <div class="core"><span class="label">问题核心</span><div class="q">${esc(q || "还没有问题")}</div><span class="sun"></span></div>`;
  if (!pts.length) {
    html += `<div class="legend"><div>大家聊起来以后，观点会出现在这里</div></div>`;
  }
  // 按接话人数分三圈；同一圈里均匀分布角度，避免叠在一起
  const rings = [pts.filter(p => p.score >= 2), pts.filter(p => p.score === 1), pts.filter(p => p.score === 0)];
  const radius = [[22, 24], [33, 31], [42, 36]];   // 横向 %，纵向 %
  rings.forEach((list, r) => list.forEach((p, k) => {
    const ang = (k / Math.max(list.length, 1)) * Math.PI * 2 + r * 0.9 + 0.4;
    const x = 50 + Math.cos(ang) * radius[r][0], y = 46 + Math.sin(ang) * radius[r][1];
    const m = current.members.find(x => x.id === p.sender);
    const cls = r === 0 ? "inner" : r === 2 ? "outer" : "";
    const tags = [p.harsh ? '<span class="hs">刺耳但有用</span>' : "", p.score ? `<span>${p.score} 人接话</span>` : "", p.starred ? '<span class="st">★</span>' : ""].filter(Boolean).join(" ");
    html += `<button class="node ${cls} ${p.harsh ? "harsh" : ""}" style="--c:${m?.color || "#999"};left:${Math.max(10, Math.min(90, x))}%;top:${Math.max(10, Math.min(78, y))}%;animation-delay:${-k * 1.3}s"
      onclick="jumpTo('${p.id}')" title="点一下回到对话里这条消息"><div class="nh"><b>${esc(senderName(p.sender))}</b><span>${tags}</span></div>${esc(p.text.length > 60 ? p.text.slice(0, 60) + "…" : p.text)}</button>`;
  }));
  html += `<div class="legend">
      <div><i style="background:var(--text)"></i>越靠近中心：被越多成员接话、引用</div>
      <div><span style="color:var(--star);width:10px">★</span>你标星的：只加记号，不改位置</div>
      <div><i style="border:1px solid var(--faint)"></i>越靠边越淡：跑题、没人接</div></div>
    <div class="sandbox-actions">
      <button class="btn small" onclick="setView('chat')">回到对话继续聊</button>
      <button class="btn small primary" onclick="toggleBoard(true);generateInsights()">总结共识</button></div>`;
  box.innerHTML = html;
}

/* ---------- 消息操作 ---------- */
function findMsg(id) { return current.messages.find(m => m.id === id); }
function snippet(m) {
  const t = (m.text || "").replace(/\s+/g, " ");
  const a = m.attachments?.length ? `[${m.attachments.map(x => x.type === "image" ? "图片" : x.name).join("、")}]` : "";
  return ((a + " " + t).trim()).slice(0, 60);
}
async function copyMsg(id) {
  const text = findMsg(id)?.text || "";
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast("已复制");
}
function quoteMsg(id) { setReply(findMsg(id)); $("input").focus(); }
function setReply(msg) {
  replyTo = msg;
  $("reply-bar").style.display = msg ? "flex" : "none";
  if (msg) $("reply-text").textContent = `回复 ${senderName(msg.sender)}：${snippet(msg)}`;
}
async function deleteMsg(id) {
  if (!await confirmBox("删除这条消息？", "删除")) return;
  current.messages = current.messages.filter(m => m.id !== id);
  saveGroup(current, false);
  renderView(); renderSidebar(); renderHeader();
}
function viewImage(src) { $("lightbox").querySelector("img").src = src; $("lightbox").classList.add("show"); }

/* =====================================================================
   观点板：让一个AI读完聊天记录，按「立场」把观点分组（不是按人、也不按你爱不爱听）
   ===================================================================== */
let boardOpen = false, linking = null, insightsBusy = false;
const msgCount = g => g.messages.filter(m => m.sender !== "system" && !m.error).length;

function toggleBoard(force) {
  boardOpen = force ?? !boardOpen;
  $("board").hidden = !boardOpen;
  $("board-btn").classList.toggle("on", boardOpen);
  if (!boardOpen) { linking = null; return; }
  renderBoard();
  if (!current.insights && !insightsBusy && msgCount(current) >= 3) generateInsights();
}
function markBoardStale() { if (boardOpen && !insightsBusy) renderBoard(); }

function renderBoard() {
  if (!boardOpen || !current) return;
  const g = current, ins = g.insights;
  $("link-btn").textContent = linking ? (linking.length ? "再点一个观点…" : "点第一个观点…") : "连线两个观点";
  let html = "";
  if (insightsBusy) html += `<div class="b-note">正在让 AI 读聊天记录、按立场整理…</div>`;
  if (!ins) {
    if (!insightsBusy) html += `<div class="b-note">多聊几句以后，点右上角的 ↻，AI 会把大家的观点按立场分成几组。<br>
      分组只看观点本身，不看你喜不喜欢；泼冷水但有用的话会单独放进「刺耳但有用」。</div>`;
  } else {
    const fresh = msgCount(g) - ins.at;
    html += `<div class="b-question">问题：${esc(ins.question || g.name)}</div>`;
    if (fresh >= 2) html += `<div class="b-note">又有 ${fresh} 条新消息，点右上角 ↻ 重新整理</div>`;
    for (const grp of ins.groups) {
      html += `<div class="b-group ${grp.kind === "harsh" ? "harsh" : ""}"><div class="b-title">${esc(grp.title)} · ${grp.items.length}</div>` +
        grp.items.map(it => boardItemHtml(it, g)).join("") + `</div>`;
    }
  }
  if (g.links?.length) {
    html += `<div class="b-group"><div class="b-title">线索连线</div>` + g.links.map((l, i) =>
      `<div class="b-link"><span>${esc(pointLabel(l.a, g))} ↔ ${esc(pointLabel(l.b, g))}</span>
       <button class="icon-btn" style="width:24px;height:24px;font-size:12px" aria-label="删除连线" onclick="current.links.splice(${i},1);saveGroup(current,false);renderBoard()">✕</button></div>`).join("") + `</div>`;
  }
  if (g.threads?.length) {
    html += `<div class="b-group"><div class="b-title">已保存的线索 · ${g.threads.length}</div>` + [...g.threads].reverse().map(t =>
      `<details class="b-saved"><summary>${longTime(t.at)} · ${esc(t.question || "")}</summary>
        <div class="b-note">${t.groups.map(gr => `<b>${esc(gr.title)}</b>：${gr.items.map(it => esc(it.text)).join("；")}`).join("<br>")}
        ${t.links?.length ? "<br><b>连线</b>：" + t.links.map(l => esc(l.label)).join("；") : ""}</div></details>`).join("") + `</div>`;
  }
  if (ins?.cost) html += `<div class="b-note small">上次整理花费约 $${Number(ins.cost).toFixed(4)}</div>`;
  $("board-body").innerHTML = html;
}
function boardItemHtml(it, g) {
  const msg = g.messages.find(m => m.id === it.id);
  const m = g.members.find(x => x.id === msg?.sender);
  const picked = linking?.includes(it.id) ? "picked" : "";
  return `<button class="b-item ${picked}" style="--c:${m?.color || "var(--muted)"}" onclick="boardClick('${it.id}')"
    title="${linking ? "选这个观点来连线" : "点一下回到对话里这条消息"}"><b>${esc(m?.name || it.name || "")}</b>${esc(it.text)}</button>`;
}
function pointLabel(id, g) {
  for (const grp of g.insights?.groups || []) for (const it of grp.items) if (it.id === id) return it.text;
  const msg = g.messages.find(m => m.id === id);
  return msg ? snippet(msg).slice(0, 20) : "（已删除）";
}
function boardClick(id) {
  if (!linking) return jumpTo(id);
  if (linking.includes(id)) return;
  linking.push(id);
  if (linking.length === 2) {
    current.links ||= [];
    const [a, b] = linking;
    current.links.push({ a, b, at: Date.now(), label: `${pointLabel(a, current)} ↔ ${pointLabel(b, current)}` });
    saveGroup(current, false);
    linking = null;
    toast("已经连起来了");
  }
  renderBoard();
}
function startLink() {
  if (!current.insights) return toast("先整理一下观点（点 ↻）再连线");
  linking = linking ? null : [];
  renderBoard();
}
function saveThread() {
  const ins = current.insights;
  if (!ins) return toast("先整理一下观点（点 ↻）再保存");
  current.threads ||= [];
  current.threads.push({ at: Date.now(), question: ins.question, groups: structuredClone(ins.groups),
    links: (current.links || []).map(l => ({ label: l.label })) });
  saveGroup(current, false);
  renderBoard();
  toast("已保存今晚的线索，以后在观点板最下面能找到");
}

async function generateInsights() {
  const g = current;
  if (insightsBusy) return;
  if (!config.apiKey) return openSettings();
  const msgs = g.messages.filter(m => !m.error && m.sender !== "system" && (m.text || m.attachments?.length));
  if (msgs.length < 2) return toast("再多聊几句再整理吧");
  const model = activeMembers(g)[0]?.model;
  if (!model) return toast("群里没有可用的AI");
  insightsBusy = true; renderBoard();
  const transcript = msgs.slice(-60).map(m =>
    `[${m.id}] ${senderName(m.sender, g)}${m.sender === "user" ? "（提问的人）" : ""}: ${(m.text || "[发了附件]").replace(/\s+/g, " ").slice(0, 300)}`).join("\n");
  const sys = `你是群聊的记录员。用户会给你一段群聊记录，每行格式是「[消息id] 名字: 内容」。
请把 AI 成员们提出的观点，按「立场或思路」分成 2~4 组（不是按人分组）。
- question：一句话概括大家在讨论的核心问题，不超过 20 个字
- 每组的 title 不超过 6 个字，比如「先想清楚」「直接行动」
- 让人不舒服但可能有用的观点（泼冷水、指出风险、说出提问的人可能不爱听的事实）单独放一组，title 写「刺耳但有用」，kind 写 "harsh"；其他组 kind 写 "normal"。没有这种观点就不要这一组
- 每个观点的 text 用不超过 25 个字提炼，id 填它来自的那条消息的 id
- 不要按提问的人喜不喜欢来取舍；跑题、闲聊、单纯附和的话不要收
- 只输出 JSON，不要任何其他文字：{"question":"…","groups":[{"title":"…","kind":"normal","items":[{"id":"…","text":"…"}]}]}`;
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Authorization": "Bearer " + config.apiKey, "Content-Type": "application/json", "X-Title": "AI Group Chat" },
      body: JSON.stringify({ model, messages: [{ role: "system", content: sys }, { role: "user", content: transcript }], max_tokens: 1200 }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) throw new Error(friendlyError(data.error?.message, res.status));
    const raw = data.choices?.[0]?.message?.content || "";
    const json = JSON.parse((raw.match(/\{[\s\S]*\}/) || ["{}"])[0]);
    const ids = new Set(g.messages.map(m => m.id));
    const groupsOut = (json.groups || []).map(grp => ({
      title: String(grp.title || "观点").slice(0, 10), kind: grp.kind === "harsh" ? "harsh" : "normal",
      items: (grp.items || []).filter(it => ids.has(it.id)).map(it => ({ id: it.id, text: String(it.text || "").slice(0, 40) })),
    })).filter(grp => grp.items.length);
    if (!groupsOut.length) throw new Error("没整理出观点，再多聊几句试试");
    g.insights = { at: msgCount(g), question: String(json.question || "").slice(0, 30), groups: groupsOut, cost: data.usage?.cost };
    g.insightsCost = (g.insightsCost || 0) + (data.usage?.cost || 0);
    saveGroup(g, false);
  } catch (e) {
    toast("整理观点失败：" + (e instanceof SyntaxError ? "AI 返回的格式不对，再试一次" : e.message));
  } finally {
    insightsBusy = false;
    if (g === current) { renderBoard(); if (view === "sandbox") renderSandbox(); }
  }
}

/* =====================================================================
   发送 & AI 发言
   ===================================================================== */
function systemPromptFor(member, g) {
  const others = g.members.filter(m => m.enabled && m.id !== member.id).map(m => m.name);
  const u = config.userName;
  return `你在一个微信群「${g.name}」里和朋友聊天，你不是在当AI助手。群里有真人「${u}」` +
    (others.length ? `，还有 ${others.join("、")}` : "") +
    `。你叫「${member.name}」。你的人设：${member.persona || "普通群友"}

怎么说话（最重要）：
- 你是在手机上打字，不是在写文章。每条 5~30 个字，一句话就够。
- 大多数时候只发 1 条。偶尔想到第二句，才用单独一行的 /// 隔开再发 1 条。最多 2 条。
- 一次只说一个点：一个观点、一个反问、或者一句吐槽。别论证、别举一堆例子、别给完整方案，剩下的等别人接话。
- 宁可短，不要全。说一半留个钩子，比一次说完更像真人。
- 好的例子：「先别急着转。」「你不喜欢的是课本身，还是以后要干的活？」「转！教育加 AI 现在是风口」「@Claude 你也太谨慎了哈哈」
- 坏的例子：一条里写两三行、先肯定再转折再总结、把几个理由都列出来。
- 例外：${u}明确要你详细说、要步骤/方案/代码、或者让你分析文件和图片时，可以发一条长消息。
- 要有自己的观点和情绪：可以开玩笑、吐槽、接梗、反驳、站队。可以用语气词和emoji，但别每条都加。
- 不要说"作为AI"，不要客套，不要列 1.2.3.，不要总结，不要问"还有什么可以帮你"。
- 想让某个群友接话时可以@他，比如"@${others[0] || u} 你怎么看"。别每次都@。
- 群友发的图片和文件你能看到的话，就像朋友一样自然地聊它。
- 别人说过的不要重复。没什么想说的，就只回复 [PASS]（潜水）。但如果你被@了、被引用了，或者还没人回复${u}，就必须说点什么。
- 别人的发言以「[名字]: 内容」出现。你直接说话，开头不要写自己的名字，也不要替别人说话。
- 用${u}用的语言聊。`;
}

// 把群里的聊天记录，整理成"这个AI眼中"的对话
function buildMessagesFor(member, g, history) {
  const out = [{ role: "system", content: systemPromptFor(member, g) }];
  const recent = history.filter(m => !m.error).slice(-MAX_HISTORY);
  const vision = canSeeImages(member.model);
  const toParts = c => typeof c === "string" ? [{ type: "text", text: c }] : c;

  recent.forEach((msg, idx) => {
    const isSelf = msg.sender === member.id;
    const role = isSelf ? "assistant" : "user";
    let text = msg.text || "";
    if (!isSelf) {
      let q = "";
      if (msg.replyTo) {
        const qm = g.messages.find(m => m.id === msg.replyTo);
        if (qm) q = `（回复 ${senderName(qm.sender, g)}：「${snippet(qm)}」）`;
      }
      text = `[${senderName(msg.sender, g)}]: ${q}${text}`;
    }
    const parts = [];
    const fresh = idx >= recent.length - IMAGE_HISTORY;
    for (const a of msg.attachments || []) {
      if (a.type === "text") {
        text += `\n\n[附件：${a.name}]\n\`\`\`\n${a.text}\n\`\`\``;
      } else if (a.type === "image") {
        if (vision && fresh) parts.push({ type: "image_url", image_url: { url: a.dataUrl } });
        else text += `\n[发了一张图片${vision ? "（较早的图片，这里省略）" : "，但你看不到图片，可以直说"}]`;
      } else if (a.type === "pdf") {
        if (fresh) parts.push({ type: "file", file: { filename: a.name, file_data: a.dataUrl } });
        else text += `\n[发过一个PDF：${a.name}（较早的文件，这里省略）]`;
      }
    }
    const content = parts.length ? [{ type: "text", text }, ...parts] : text;
    const last = out[out.length - 1];
    if (last.role === role && role !== "system") {
      last.content = (typeof last.content === "string" && typeof content === "string")
        ? last.content + "\n\n" + content
        : [...toParts(last.content), ...toParts(content)];
    } else out.push({ role, content });
  });
  if (out[out.length - 1].role !== "user") {
    out.push({ role: "user", content: "[主持人]: 请继续发言，回应群里最新的讨论。" });
  }
  return out;
}

async function askMember(member, g, history) {
  const ctrl = new AbortController();
  if (!controllers.has(g.id)) controllers.set(g.id, []);
  controllers.get(g.id).push(ctrl);
  const res = await fetch(API_URL, {
    method: "POST", signal: ctrl.signal,
    headers: { "Authorization": "Bearer " + config.apiKey, "Content-Type": "application/json", "X-Title": "AI Group Chat" },
    body: JSON.stringify({ model: member.model, messages: buildMessagesFor(member, g, history), max_tokens: 1500 }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) throw new Error(friendlyError(data.error?.message, res.status));
  const text = data.choices?.[0]?.message?.content?.trim();
  if (!text) throw new Error("模型没有返回内容");
  return { text, cost: data.usage?.cost };
}
function friendlyError(msg, status) {
  if (status === 401) return "API Key 不对或已失效，去 ⚙️ 设置里检查一下";
  if (status === 402) return "OpenRouter 余额不足，去充值后再试";
  if (status === 429) return "请求太频繁了，等一会儿再试";
  return msg || `请求失败（HTTP ${status}）`;
}

function mentionedMembers(text, g) {
  const hit = g.members.filter(m => m.enabled && m.model && text.includes("@" + m.name));
  return hit.length ? hit : activeMembers(g);
}

async function send() {
  const g = current;
  const text = $("input").value.trim();
  if ((!text && !pendingAtts.length) || busyGroups.has(g.id)) return;
  if (!config.apiKey) return openSettings();
  let targets = mentionedMembers(text, g);
  // 引用了某个AI的话（又没@别人），就让被引用的那个AI来回
  if (replyTo && !text.includes("@")) {
    const qm = g.members.find(m => m.id === replyTo.sender && m.enabled && m.model);
    if (qm) targets = [qm];
  }
  if (!targets.length) { toast("群里没有可用的AI，点右上角头像去开启成员"); return; }

  addMessage(g, { sender: "user", text, attachments: pendingAtts.length ? pendingAtts : undefined, replyTo: replyTo?.id });
  if (view === "chat" && !g._expanded && roundStarts(g).length > KEEP_ROUNDS) renderChat();   // 早的轮次收起来
  $("input").value = ""; autoGrow();
  pendingAtts = []; renderPending(); setReply(null); hideMention();
  await runRound(g, targets);
}

async function debateRound() {
  const g = current;
  if (busyGroups.has(g.id)) return;
  if (!config.apiKey) return openSettings();
  const targets = activeMembers(g);
  if (targets.length < 2) return toast("至少要有两个AI成员才能互相评论");
  addMessage(g, { sender: "system", text: "大家看看刚才别人说的：谁说得不对？谁漏了什么？直接@他怼回去或者补充，这一轮不许潜水。" });
  await runRound(g, targets, "natural", true);
}

async function runRound(g, targets, forceMode, forceAll) {
  setBusy(g, true);
  const mode = forceMode || g.mode;
  const said = [];
  try {
    if (mode === "parallel") {
      const snapshot = [...g.messages];
      await Promise.all(targets.map(async m => said.push(...await replyFrom(g, m, snapshot))));
    } else {
      const order = mode === "natural" ? shuffle(targets).slice(0, forceAll ? targets.length : MAX_SPEAKERS) : targets;
      for (const m of order) {
        if (!busyGroups.has(g.id)) break;
        if (mode === "natural") await sleep(400 + Math.random() * 1200);
        said.push(...await replyFrom(g, m, g.messages));
      }
    }
    // 接话：AI们@了谁，谁就接着说
    let chain = 0;
    for (let i = 0; i < said.length && chain < MAX_CHAIN && busyGroups.has(g.id); i++) {
      const targetsInMsg = activeMembers(g).filter(m => m.id !== said[i].sender && said[i].text.includes("@" + m.name));
      for (const t of targetsInMsg) {
        if (chain >= MAX_CHAIN || !busyGroups.has(g.id)) break;
        chain++;
        await sleep(500 + Math.random() * 1000);
        said.push(...await replyFrom(g, t, g.messages));
      }
    }
  } finally {
    setBusy(g, false);
  }
}

async function replyFrom(g, member, history) {
  setTyping(g, member.id, true);
  try {
    const { text, cost } = await askMember(member, g, history);
    let parts = text.replace(/\[PASS\]/gi, "").split(/\n?[ \t]*\/\/\/[ \t]*\n?/).map(s => s.trim()).filter(Boolean);
    if (parts.length > MAX_BUBBLES) parts = [...parts.slice(0, MAX_BUBBLES - 1), parts.slice(MAX_BUBBLES - 1).join("\n")];
    const out = [];
    for (let i = 0; i < parts.length; i++) {
      if (i > 0) {
        if (!busyGroups.has(g.id)) break;
        await sleep(Math.min(500 + parts[i].length * 35, 2500));
      }
      out.push(addMessage(g, { sender: member.id, text: parts[i], cost: i === parts.length - 1 ? cost : undefined }));
    }
    return out;
  } catch (e) {
    if (e.name !== "AbortError") addMessage(g, { sender: member.id, text: "出错了：" + e.message, error: true });
    return [];
  } finally {
    setTyping(g, member.id, false);
  }
}

function stopGroup(g) {
  (controllers.get(g.id) || []).forEach(c => c.abort());
  setBusy(g, false);
}
function setBusy(g, v) {
  v ? busyGroups.add(g.id) : busyGroups.delete(g.id);
  if (!v) { controllers.set(g.id, []); typing.set(g.id, new Set()); if (g === current) renderTyping(); }
  updateBusyUI(); renderSidebar();
}
function updateBusyUI() {
  const busy = busyGroups.has(current.id);
  const b = $("send-btn");
  b.classList.toggle("stop", busy);
  b.innerHTML = busy
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
  b.title = busy ? "停止" : "发送";
  $("debate-btn").disabled = busy;
}
function onSendBtn() { busyGroups.has(current.id) ? stopGroup(current) : send(); }

/* =====================================================================
   附件：图片 / PDF / 文本文件
   ===================================================================== */
const TEXT_EXT = /\.(txt|md|csv|json|js|ts|py|html|css|java|c|cpp|cs|go|rs|sql|xml|ya?ml|log)$/i;

async function addFiles(files) {
  for (const f of files) {
    try {
      if (f.type.startsWith("image/")) {
        pendingAtts.push({ type: "image", name: f.name || "图片", size: f.size, dataUrl: await shrinkImage(f) });
      } else if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
        if (f.size > 15 * 1024 * 1024) { toast(`${f.name} 太大了（PDF 最大 15MB）`); continue; }
        pendingAtts.push({ type: "pdf", name: f.name, size: f.size, dataUrl: await readAs(f, "dataurl") });
      } else if (f.type.startsWith("text/") || TEXT_EXT.test(f.name)) {
        let text = await readAs(f, "text");
        if (text.length > 30000) text = text.slice(0, 30000) + "\n…（文件太长，后面省略了）";
        pendingAtts.push({ type: "text", name: f.name, size: f.size, text });
      } else {
        toast(`暂时不支持 ${f.name}，可以发图片、PDF 或文本/代码文件`);
      }
    } catch { toast(`读取 ${f.name} 失败`); }
  }
  renderPending();
}
function readAs(file, kind) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(r.error);
    kind === "text" ? r.readAsText(file) : r.readAsDataURL(file);
  });
}
// 图片压缩到最长边 1280 像素，省空间也省钱
async function shrinkImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.85);
  } finally { URL.revokeObjectURL(url); }
}
function renderPending() {
  const box = $("pending-atts");
  box.style.display = pendingAtts.length ? "flex" : "none";
  box.innerHTML = pendingAtts.map((a, i) => `<div class="pending">
    ${a.type === "image" ? `<img src="${a.dataUrl}">` : `<div class="file-chip">📄 <span>${esc(a.name)}</span></div>`}
    <button class="x" onclick="pendingAtts.splice(${i},1);renderPending()">✕</button></div>`).join("");
}

/* =====================================================================
   @ 提示
   ===================================================================== */
let mentionIdx = 0, mentionList = [];
function checkMention() {
  const el = $("input");
  const before = el.value.slice(0, el.selectionStart);
  const m = before.match(/@([^\s@]*)$/);
  if (!m) return hideMention();
  const q = m[1].toLowerCase();
  mentionList = current.members.filter(x => x.enabled && x.name.toLowerCase().includes(q));
  if (!mentionList.length) return hideMention();
  mentionIdx = Math.min(mentionIdx, mentionList.length - 1);
  const pop = $("mention-pop");
  pop.innerHTML = mentionList.map((x, i) => `<div class="mention-item ${i === mentionIdx ? "active" : ""}" onmousedown="event.preventDefault();pickMention(${i})">
    <div class="avatar sm" style="--c:${x.color}">${esc(x.avatar)}</div><span>${esc(x.name)}</span>
    <span class="small muted" style="margin-left:auto">${esc(shortModel(x.model))}</span></div>`).join("");
  pop.style.display = "block";
}
function hideMention() { $("mention-pop").style.display = "none"; mentionList = []; mentionIdx = 0; }
function pickMention(i) {
  const el = $("input");
  const pos = el.selectionStart;
  const before = el.value.slice(0, pos).replace(/@([^\s@]*)$/, "@" + mentionList[i].name + " ");
  el.value = before + el.value.slice(pos);
  el.selectionStart = el.selectionEnd = before.length;
  hideMention(); el.focus(); autoGrow();
}

/* =====================================================================
   右侧面板：群设置 + 成员
   ===================================================================== */
let openMemberId = null;
function togglePanel(force) {
  const p = $("panel");
  const open = force ?? !p.classList.contains("open");
  p.classList.toggle("open", open);
  if (open) renderPanel();
}

function renderPanel() {
  if (!current || !$("panel").classList.contains("open")) return;
  const g = current;
  const totalCost = g.messages.reduce((s, m) => s + (m.cost || 0), 0) + (g.insightsCost || 0);
  $("panel-body").innerHTML = `
    <div class="field"><label>群名</label><input type="text" id="group-name" value="${esc(g.name)}"
      oninput="current.name=this.value||'未命名的群';saveGroup(current,false);renderHeader();renderSidebar()"></div>
    <div class="field"><label>发言模式</label>
      <div class="segmented">${Object.entries(MODES).map(([k, v]) =>
        `<button class="${g.mode === k ? "on" : ""}" onclick="setMode('${k}')">${v.label}</button>`).join("")}</div>
      <div class="mode-desc">${MODES[g.mode]?.desc || ""}</div></div>
    <div class="small muted" style="margin:0 2px 4px">本群累计花费约 $${totalCost.toFixed(4)} · ${g.messages.length} 条消息</div>

    <div class="section-title">群成员 · ${g.members.length}</div>
    <div id="member-list">${g.members.map(memberCardHtml).join("")}</div>
    <button class="btn" style="width:100%;margin-top:4px" onclick="addMember()">＋ 拉一个新成员进群</button>

    <div class="section-title">其他</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small" onclick="clearGroup()">清空聊天记录</button>
      <button class="btn small danger" onclick="deleteGroup()">删除这个群</button>
    </div>`;
}

function memberCardHtml(m) {
  const open = openMemberId === m.id;
  const info = modelInfo(m.model);
  return `<div class="member-card ${open ? "open" : ""} ${m.enabled ? "" : "disabled"}" id="mc-${m.id}">
    <div class="mc-head" onclick="toggleMember('${m.id}')">
      <div class="avatar" style="--c:${m.color}">${esc(m.avatar)}</div>
      <div class="info"><div class="n">${esc(m.name)}</div>
        <div class="m">${esc(shortModel(m.model))}${m.model && canSeeImages(m.model) && info ? '<span class="tag">可看图</span>' : ""}</div></div>
      <label class="switch" onclick="event.stopPropagation()" title="在群里 / 暂时移出">
        <input type="checkbox" ${m.enabled ? "checked" : ""} onchange="updMember('${m.id}','enabled',this.checked)"><span></span></label>
    </div>
    ${open ? `<div class="mc-edit">
      <div class="row2" style="margin-top:10px">
        <div class="field narrow"><label>头像</label><input type="text" maxlength="4" value="${esc(m.avatar)}" oninput="updMember('${m.id}','avatar',this.value||'?')"></div>
        <div class="field"><label>名字（@ 时用这个）</label><input type="text" value="${esc(m.name)}" oninput="updMember('${m.id}','name',this.value.trim()||'AI')"></div>
      </div>
      <div class="field"><label>颜色</label><div class="swatches">
        ${PALETTE.map(c => `<button class="swatch ${c === m.color ? "on" : ""}" style="background:${c}" onclick="updMember('${m.id}','color','${c}',true)"></button>`).join("")}
      </div></div>
      <div class="field"><label>模型（输入关键字搜索：claude、gpt、gemini、deepseek、qwen…）</label>
        <input type="text" list="model-options" value="${esc(m.model)}" placeholder="例如 anthropic/…"
          onchange="updMember('${m.id}','model',this.value.trim(),true)">
        <div class="model-info">${info ? esc(info.name || "") + (canSeeImages(m.model) ? " · 可以看图片" : " · 看不了图片") + esc(priceText(info)) : (m.model ? "列表里没找到这个模型，确认一下名字" : "")}</div></div>
      <div class="field"><label>人设</label>
        <select onchange="if(this.value){updMember('${m.id}','persona',PERSONA_TEMPLATES[this.value],true)}">
          <option value="">套用一个人设模板…</option>
          ${Object.keys(PERSONA_TEMPLATES).map(k => `<option value="${k}">${k}</option>`).join("")}
        </select>
        <textarea style="margin-top:6px" rows="5" oninput="updMember('${m.id}','persona',this.value)">${esc(m.persona || "")}</textarea></div>
      <button class="btn small danger" onclick="removeMember('${m.id}')">把 ${esc(m.name)} 移出群聊</button>
    </div>` : ""}
  </div>`;
}

function toggleMember(id) { openMemberId = openMemberId === id ? null : id; renderPanel(); }
function setMode(k) { current.mode = k; saveGroup(current, false); renderPanel(); renderHeader(); }

let saveTimer = null;
function updMember(id, key, value, rerender) {
  const m = current.members.find(x => x.id === id);
  if (!m) return;
  m[key] = value;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveGroup(current, false), 400);
  renderHeader(); renderSidebar();
  if (rerender || key === "enabled") renderPanel();
  else {   // 正在打字的时候只刷新卡片头部，不打断输入
    const head = document.querySelector(`#mc-${id} .mc-head`);
    if (head) {
      head.querySelector(".avatar").textContent = m.avatar;
      head.querySelector(".n").textContent = m.name;
    }
  }
}
function addMember() {
  const used = current.members.map(m => m.color);
  const m = { id: uid("m_"), name: "新成员", avatar: "新", color: PALETTE.find(c => !used.includes(c)) || PALETTE[0],
              enabled: true, model: current.members.find(x => x.model)?.model || "", persona: "" };
  current.members.push(m);
  openMemberId = m.id;
  saveGroup(current, false);
  renderPanel(); renderHeader(); renderSidebar();
}
async function removeMember(id) {
  const m = current.members.find(x => x.id === id);
  if (!await confirmBox(`把 ${esc(m.name)} 移出群聊？（只是想暂时不让它说话的话，关掉右边的开关就行）`, "移出")) return;
  current.members = current.members.filter(x => x.id !== id);
  saveGroup(current, false);
  renderPanel(); renderHeader(); renderSidebar();
}

/* =====================================================================
   设置弹窗、主题、侧边栏
   ===================================================================== */
let draftTheme = "auto";
function openSettings() {
  $("set-key").value = config.apiKey;
  $("set-key").type = "password";
  $("set-username").value = config.userName;
  $("set-avatar").value = config.userAvatar;
  draftTheme = config.theme;
  paintThemeButtons();
  $("settings-ov").classList.add("show");
}
function closeSettings() { $("settings-ov").classList.remove("show"); applyTheme(); }
function saveSettings() {
  config.apiKey = $("set-key").value.trim();
  config.userName = $("set-username").value.trim() || "我";
  config.userAvatar = $("set-avatar").value.trim() || "🙂";
  config.theme = draftTheme;
  lsSave("aigc-config", config);
  closeSettings();
  renderMe(); renderHeader(); renderView();
}
function toggleKeyVisible() { const k = $("set-key"); k.type = k.type === "password" ? "text" : "password"; }
function paintThemeButtons() {
  document.querySelectorAll("#set-theme button").forEach(b => b.classList.toggle("on", b.dataset.v === draftTheme));
}
document.querySelectorAll("#set-theme button").forEach(b => b.onclick = () => {
  draftTheme = b.dataset.v; paintThemeButtons(); applyTheme(draftTheme);
});
function applyTheme(t = config.theme) {
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => applyTheme());

function renderMe() {
  const a = config.userAvatar && config.userAvatar !== "🙂" ? config.userAvatar : [...(config.userName || "我")][0];
  $("me-btn").textContent = a;
  $("me-btn").title = `${config.userName} · 设置`;
}

/* ---------- 小工具 ---------- */
function confirmBox(html, okText = "确定") {
  return new Promise(resolve => {
    $("confirm-text").innerHTML = html;
    $("confirm-yes").textContent = okText;
    const ov = $("confirm-ov");
    ov.classList.add("show");
    const done = v => { ov.classList.remove("show"); resolve(v); };
    $("confirm-yes").onclick = () => done(true);
    $("confirm-no").onclick = () => done(false);
  });
}
let toastTimer = null;
function toast(text) {
  const t = $("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function renderMarkdown(text) {
  let html = esc(text);
  html = html.replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => `<pre><code>${code}</code></pre>`);
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/^#{1,6}\s+(.+)$/gm, "<strong>$1</strong>");
  return html.split(/(<pre>[\s\S]*?<\/pre>)/).map(p => p.startsWith("<pre>") ? p : p.replace(/\n/g, "<br>")).join("");
}
function fmtSize(n) { return !n ? "" : n < 1024 * 1024 ? Math.ceil(n / 1024) + "KB" : (n / 1024 / 1024).toFixed(1) + "MB"; }
const pad = n => String(n).padStart(2, "0");
function shortTime(ts) {
  if (!ts) return "";
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "昨天";
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function longTime(ts) {
  const d = new Date(ts), s = shortTime(ts), hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return s.includes(":") ? hm : s === "昨天" ? `昨天 ${hm}` : `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
}

/* =====================================================================
   输入框事件
   ===================================================================== */
const inputEl = $("input");
function autoGrow() { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px"; }
const touchDevice = matchMedia("(pointer: coarse)").matches;
inputEl.addEventListener("input", () => { autoGrow(); checkMention(); });
inputEl.addEventListener("click", checkMention);
inputEl.addEventListener("blur", () => setTimeout(hideMention, 150));
inputEl.addEventListener("keydown", e => {
  if (mentionList.length && $("mention-pop").style.display === "block") {
    if (e.key === "ArrowDown") { e.preventDefault(); mentionIdx = (mentionIdx + 1) % mentionList.length; return checkMention(); }
    if (e.key === "ArrowUp") { e.preventDefault(); mentionIdx = (mentionIdx - 1 + mentionList.length) % mentionList.length; return checkMention(); }
    if ((e.key === "Enter" || e.key === "Tab") && !e.isComposing) { e.preventDefault(); return pickMention(mentionIdx); }
    if (e.key === "Escape") return hideMention();
  }
  // 手机上回车是换行，用发送按钮发；电脑上 Enter 发送、Shift+Enter 换行
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && !touchDevice) { e.preventDefault(); send(); }
});
inputEl.addEventListener("paste", e => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); addFiles(files); }
});
$("file-input").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });

// 拖文件到窗口任何地方都可以
let dragDepth = 0;
window.addEventListener("dragenter", e => { if (e.dataTransfer?.types?.includes("Files")) { dragDepth++; $("composer").classList.add("dragover"); } });
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("composer").classList.remove("dragover"); } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; $("composer").classList.remove("dragover");
  if (e.dataTransfer?.files?.length) addFiles([...e.dataTransfer.files]);
});

$("chat").addEventListener("scroll", () => { if (isNearBottom()) $("new-pill").style.display = "none"; });
document.addEventListener("click", e => {
  if (!e.target.closest(".msg")) document.querySelectorAll(".msg.show-actions").forEach(x => x.classList.remove("show-actions"));
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  $("lightbox").classList.remove("show");
  if ($("settings-ov").classList.contains("show")) closeSettings();
  else if ($("panel").classList.contains("open")) togglePanel(false);
  else if (boardOpen) toggleBoard(false);
});

init();
</script>
